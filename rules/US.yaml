- id: US.income_alternative.seasonal_worker_mechanics
  topic: income_alternative
  statement: 'Where a State has no reasonably-predictable-changes methodology, the seasonal test averages
    the 6 months preceding each assessed month; where it does, the State''s prorated MAGI monthly income
    is used. Example: 2 months at $1,500 averaged over 6 = $500, below $580.'
  value: null
  unit: text
  effective_from: '2027-01-01'
  effective_to: null
  known_from: '2026-06-03'
  citations:
  - source_id: fed-ifr-2026-06-03
    quote: the State would use the individual's average income over the preceding 6 months, as provided
      at section 1902(xx)(2)(G) of the Act.
  - source_id: fed-ifr-2026-06-03
    quote: Because $500 is below $580, this individual is not considered to be demonstrating community
      engagement in June based on the 6-month average monthly income for seasonal workers.
  - source_id: fed-ifr-2026-06-03
    quote: States must use their reasonably predictable changes methodology to determine monthly income
      when an individual has fluctuating income that is subject to the State's methodology.
  confidence: medium
  notes: ''
- id: US.income_alternative.income_to_hours_option
  topic: income_alternative
  statement: If monthly income is below Federal minimum wage x 80 and the State has no documentation of
    hours worked, the State may convert income to work hours by dividing monthly MAGI income by the Federal
    minimum wage; the resulting hours are combined with other activities.
  value: income / federal_minimum_wage
  unit: hours
  effective_from: '2027-01-01'
  effective_to: null
  known_from: '2026-06-03'
  citations:
