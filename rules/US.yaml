      paragraph (f)(2) of this section by the applicable Federal minimum wage requirement under 29 U.S.C.
      206(a)(1)(C).
  - source_id: fed-ifr-2026-06-03
    quote: this option must only be used when the monthly income is less than the applicable Federal minimum
