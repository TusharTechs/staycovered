open_questions:
- Which States have requested or been granted CMS good-faith-effort exemptions (and for how long)? Not
  in any captured federal source; see state fact packs / CMS announcements.
- How each State allocates converted work hours among household members ('reasonable method') -- the IFR
  leaves this to States; check State plans/SPAs.
- Whether self-employment income for the 42 CFR 435.603 MAGI test is gross or net of business expenses
  -- the IFR says MAGI-based but does not address gig/self-employment netting explicitly in the captured
  passages; defer to 435.603 and State practice.
- Exact number of look-back months at application (1-3) and verification months at renewal are State choices;
  see state packs.
- 'Operational guidance on Marketplace/APTC coordination: IFR says ''We expect to issue operational guidance'';
  none found among captured sources.'
