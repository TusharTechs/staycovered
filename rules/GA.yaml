- id: GA.exemption.2027_specified_excluded
  topic: exemption
  statement: 'Specified excluded individuals: AI/AN; former foster youth; inmate; medically frail; TANF/SNAP work requirements; drug/alcohol treatment participant; pregnant or postpartum 0-12 months; parent/guardian/caretaker relative/family caregiver of a dependent child 13 and under or of a disabled individual; veteran with total disability rating.'
  value: null
  unit: null
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: Are a parent, guardian, caretaker relative or family caregiver of a dependent child 13 years of age and under or of a disabled individual
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: Are a veteran with a total disability rating
  confidence: high
