    quote: $15,960 per year or $1,330 on average per month for one person
  - source_id: ga-pathways-faq-2026-10-09
    quote: $27,320 per year or $2,277 on average per month for a family of three
  confidence: high
  notes: ''
- id: GA.requirement.hours_80
  topic: requirement
  statement: Must demonstrate at least 80 hours per month of community engagement (called qualifying activities before 2027).
  value: 80
  unit: hours
  effective_from: 2023-07-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: Like the current program, individuals are required to demonstrate at least 80 hours per month of certain activities.
  confidence: high
  notes: ''
- id: GA.requirement.activities_2026
  topic: requirement
  statement: 'Current qualifying activities: work, community service, work program, education; job readiness, inpatient/short-term skilled nursing stays, habilitation/rehabilitation incl. SUD treatment, and being parent of a child under 6 currently count and will stop counting as activities on Jan 1, 2027.'
  value: null
  unit: null
  effective_from: 2023-07-01
  effective_to: 2026-12-31
  known_from: 2026-10-09
  citations:
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: Participate in job readiness activities (will now be included as an educational program activity)
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: Be the Parent or Legal Guardian of a child under six years of age (see the “Specified Excluded Individual” section below)
  confidence: high
  notes: ''
- id: GA.requirement.activities_2027
  topic: requirement
  statement: 'From Jan. 1, 2027 community engagement activities: work at least 80 hours (incl. self-employment); 80 hours community service; 80 hours in a work program; education at least half-time; earn at least $580 per month (income must be under 100% FPL); seasonal workers: average of $580 over previous 6 months.'
  value:
  - work 80h
  - community service 80h
  - work program 80h
  - education half-time
  - income >= $580
  unit: text
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: Earn a monthly income of at least $580 (income must be under 100% FPL).
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: Enrolled in an educational program at least half-time
  confidence: high
  notes: ''
- id: GA.income_alternative.580_2027
  topic: income_alternative
  statement: 'New from Jan 1, 2027: earning at least $580 per month counts (income must be under 100% FPL); seasonal workers use a 6-month average.'
  value: 580
  unit: usd
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: For seasonal workers, earn an average monthly income over the previous 6 months of at least $580 (income must be under 100% FPL).
  confidence: high
  notes: ''
