# Georgia Pathways to Coverage fact pack
jurisdiction: GA
name: Georgia (Pathways to Coverage)
facts:
- id: GA.timeline.rules_change_2027
  topic: timeline
  statement: Pathways eligibility requirements change January 1, 2027 due to federal H.R. 1; current members are not affected until renewal in 2027.
  value: '2027-01-01'
  unit: date
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: Beginning on January 1, 2027, the Georgia Pathways to Coverage eligibility requirements will change due to federal law (Working Families Tax Cut/H.R. 1 legislation). Current Pathways members will not be affected until renewal in 2027.
  confidence: high
  notes: ''
- id: GA.applicability.applicable_individual
  topic: applicability
  statement: Pathways applicants must be age 19-64, income at or below 100% FPL, in or eligible for the state plan adult group, not pregnant, not on Medicare Part A or B, and not eligible for a mandatory/optional Medicaid group.
  value:
  - age 19-64
  - income <=100% FPL
  - not pregnant
  - no Medicare A/B
  unit: text
  effective_from: 2023-07-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: Income at or below 100% of the Federal Poverty Level
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: Not enrolled in Medicare Part A or B
  confidence: high
  notes: ''
- id: GA.applicability.income_limit_2026
  topic: applicability
  statement: '2026 income limit (100% FPL): $15,960 per year for one person; $27,320 per year for a family of three.'
  value:
  - 15960
  - 27320
  unit: usd
  effective_from: 2026-01-01
  effective_to: null
  known_from: 2026-10-09
  citations:
