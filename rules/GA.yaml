- id: GA.reporting.monthly_17th.v1
  topic: reporting
  statement: 'Aug 2024 FAQ: members reported qualifying activity hours each month by the 17th (e.g., January hours by February 17 to stay covered in March); missing the deadline without Good Cause stopped coverage on the last day of the month.'
  value: 17
  unit: days
  effective_from: 2024-08-04
  effective_to: 2025-09-03
  known_from: 2024-08-04
  citations:
  - source_id: ga-pathways-faq-2024-08-04
    quote: You must report your hours by the 17th of each month. For instance, you would report your January hours by February 17 to stay covered in March.
  - source_id: ga-pathways-faq-2024-08-04
    quote: If you do not report your 80 hours of qualifying activities by the 17th of the month or receive a Good Cause Exception, your coverage will stop.
  confidence: high
  notes: ''
- id: GA.reporting.application_and_annual_renewal.v2
  topic: reporting
  statement: 'Sept 2025 FAQ onward: qualifying activity hours are reported at the time of application and annual renewal (not monthly); activities may be verified.'
