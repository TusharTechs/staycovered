- id: GA.exemption.2027_short_term_hardship
  topic: good_cause
  statement: 'From 2027 short-term hardship exceptions: inpatient hospital/nursing facility/ICF-IID/inpatient psychiatric services (must request approval from the state); medical travel outside the community (must request approval); county disaster declaration and high-unemployment exceptions require CMS approval before Georgia can use them.'
  value: null
  unit: null
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: 'An applicable individual receiving inpatient hospital services, nursing facility services, services in an Intermediate Care Facility for Individuals with Intellectual Disabilities (ICF/IID), inpatient psychiatric hospital services, or other services with a similar level of acute care. (Note: The individual must request approval from the state)'
  - source_id: ga-pathways-hr1-changes-2026-10-09
    quote: '(Note: The State must obtain CMS approval before this specific exception can be utilized in Georgia.)'
  confidence: high
  notes: ''
- id: GA.good_cause.up_to_120_hours
  topic: good_cause
  statement: Current Pathways members may request a Good Cause Exception for up to 120 hours per certification year when unable to complete 80 hours in a month.
  value: 120
  unit: hours
  effective_from: 2023-07-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ga-pathways-good-cause-2026-10-09
    quote: You can request a Good Cause Exception for up to 120 hours per certification year so that you maintain coverage even when unexpected things happen.
  confidence: high
  notes: ''
- id: GA.good_cause.how_to_request
  topic: good_cause
  statement: Request a Good Cause Exception online at gateway.ga.gov, in person at a DFCS office, by mail to a DFCS office, or by phone at 1-877-423-4746 (711 for hearing/speech); phone requests can be documented online, by mail or in person.
  value: 1-877-423-4746
  unit: text
  effective_from: 2023-07-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ga-pathways-good-cause-2026-10-09
    quote: By phone at 1-877-423-4746 or 711 for those who are deaf, hard of hearing, deaf-blind or have difficulty speaking.
  confidence: high
  notes: ''
- id: GA.good_cause.categories
  topic: good_cause
  statement: 'Good Cause examples: family emergency or life event; birth/adoption/foster placement/death of immediate family; temporary illness or short-term injury (over three consecutive days); serious illness or hospitalization; natural or human-caused disaster; temporary homelessness; COVID-19 illness or exposure; "Other".'
  value:
  - family emergency
  - birth/adoption/death
  - temporary illness
  - serious illness or hospitalization
  - disaster
  - homelessness
  - COVID-19
  - other
  unit: text
  effective_from: 2023-07-01
  effective_to: null
  known_from: 2026-10-09
  citations:
