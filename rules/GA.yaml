- id: GA.exemption.2027_exceptions
  topic: exemption
  statement: 'From 2027: exceptions for under 19; Medicare A/B; mandatory Medicaid groups; inmate of a public institution within 3 months before the application month.'
  value: null
  unit: null
  effective_from: 2027-01-01
  effective_to: null
