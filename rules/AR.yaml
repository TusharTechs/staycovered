- id: AR.income_alternative.580
  topic: income_alternative
  statement: ARHOME recipients can meet the monthly employment requirement by earning at least $580 per month (federal minimum wage $7.25 x 80 hours).
  value: 580
  unit: usd
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ar-dhs-townhall-slides-2026-10-09
    quote: ARHOME recipients can alternately meet the monthly employment requirement by earning at least $580 per month, which represents the federal minimum wage of $7.25/hour multiplied by 80 hours.
  confidence: high
  notes: ''
