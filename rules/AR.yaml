- id: AR.verification.frequency
  topic: verification
  statement: DHS describes verification at application and then every six months (federal requirement); the 2018 monthly-reporting model is not used.
  value: 6
  unit: months
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-10-09
  citations:
