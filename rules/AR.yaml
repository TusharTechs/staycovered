  - source_id: ar-dhs-news-soft-launch-2026-02-23
    quote: The work and community engagement requirement will apply to Arkansans aged 19 to 64 enrolled in ARHOME unless they are exempt.
  - source_id: ar-dhs-townhall-slides-2026-10-09
    quote: More than 210,000 ARHOME recipients are subject to the Community Engagement and Work Requirements
  confidence: high
  notes: ''
- id: AR.requirement.hours_80
  topic: requirement
  statement: Must work, volunteer, or take classes for a combined 80 hours per month (20 hours per week).
  value: 80
  unit: hours
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-02-23
  citations:
  - source_id: ar-dhs-ce-page-2026-10-06
    quote: This means you will need to work, volunteer, or take classes for a combined total of 80 hours per month to keep your benefits beginning on January 1, 2027.
  - source_id: ar-dhs-arhome-faq-2026-05-18
    quote: must work, volunteer, or go to school for at least 20 hours per week (80 hours per month)
  confidence: high
  notes: ''
