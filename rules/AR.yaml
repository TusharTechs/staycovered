- id: AR.cure.30_days_to_show_compliance
  topic: cure
  statement: Starting Jan. 1, 2027, beneficiaries who do not meet the requirement have 30 days to show compliance before Medicaid benefits are suspended.
  value: 30
  unit: days
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-02-23
  citations:
