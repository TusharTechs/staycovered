- id: AR.verification.automated_first
  topic: verification
  statement: DHS first tries automated (ex parte) verification using data already available (e.g., wage data, SNAP applications); if confirmed the person is notified and reports nothing.
  value: null
  unit: null
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: ar-dhs-townhall-slides-2026-10-09
    quote: DHS will first attempt an automated, or ex parte, verification by checking data already available to the State (e.g., wage data, SNAP applications).
  - source_id: ar-dhs-townhall-slides-2026-10-09
    quote: If this is successful, you will be notified and you won’t have to report anything at all.
  confidence: high
  notes: ''
