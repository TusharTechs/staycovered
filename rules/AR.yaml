- id: AR.applicability.population
  topic: applicability
  statement: Applies to adults aged 19-64 enrolled in ARHOME (Medicaid expansion) who are not exempt; more than 210,000 ARHOME recipients are subject.
  value:
  - age 19-64
  - ARHOME
  - not exempt
  unit: text
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-02-23
