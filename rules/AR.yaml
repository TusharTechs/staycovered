# Arkansas ARHOME community engagement fact pack
jurisdiction: AR
name: Arkansas
facts:
- id: AR.start_date.enforcement
  topic: timeline
  statement: Full Arkansas community engagement and work requirement (with penalties) starts January 1, 2027.
  value: '2027-01-01'
  unit: date
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-02-23
  citations:
  - source_id: ar-dhs-news-soft-launch-2026-02-23
    quote: no penalties will be in effect until January 1, 2027
  - source_id: ar-dhs-arhome-faq-2026-05-18
    quote: The community engagement and work requirement will go into effect on January 1, 2027.
  confidence: high
  notes: ''
- id: AR.start_date.soft_launch
  topic: timeline
  statement: 'Soft implementation began July 1, 2026: automated checks run and beneficiaries are notified of status, with no penalties in 2026.'
  value: '2026-07-01'
  unit: date
  effective_from: 2026-07-01
  effective_to: 2026-12-31
  known_from: 2026-02-23
  citations:
  - source_id: ar-dhs-news-soft-launch-2026-02-23
    quote: Under the soft implementation starting on July 1, DHS will begin running automated processes to determine if beneficiaries are exempt, meeting, or not meeting the community engagement requirement.
  - source_id: ar-dhs-ce-page-2026-10-06
    quote: DHS launched a soft implementation of the requirement on July 1, 2026, but no penalties will be in effect until January 1, 2027.
  confidence: high
  notes: ''
- id: AR.start_date.soft_launch.future_tense
