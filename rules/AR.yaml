    quote: States must determine if a Medicaid applicant met requirements first upon application and then again every six months.
  confidence: high
  notes: ''
- id: AR.verification.not_monthly_reporting
  topic: verification
  statement: Unlike the 2018 Arkansas Works program (monthly reporting/attestation), compliance or exemption is demonstrated at application and at renewal.
