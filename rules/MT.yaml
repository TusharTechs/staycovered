  confidence: high
  notes: ''
- id: MT.lookback.redetermination
  topic: lookback
  statement: At redetermination, the person must show compliance for at least 3 months since the last redetermination (months need not be consecutive).
  value: 3
  unit: months
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-06-30
  citations:
