- id: MT.renewal.six_month
  topic: process
  statement: Beginning January 1, 2027 Medicaid Expansion clients are redetermined every six months (American Indians/Alaska Natives stay on 12 months); some cases are pulled forward starting Feb 2027.
  value: '2027-01-01'
  unit: date
  effective_from: 2027-01-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: mt-dphhs-medicaidchanges-2026-10-09
    quote: Due to new requirements in H.R. 1, clients on Medicaid Expansion will now be redetermined, or re-checked for eligibility, every six months instead of annually. This does not apply to individuals who are American Indian/Alaska Native. This change will be effective as of January 1, 2027.
  confidence: high
  notes: ''
