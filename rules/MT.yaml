- id: MT.income_alternative.580
  topic: income_alternative
  statement: Working is demonstrated by income of at least $580 per month, or documentation of 80 hours of work if income cannot be verified.
  value: 580
  unit: usd
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: mt-dphhs-medicaidchanges-2026-10-09
    quote: Working at a job (paid or in-kind), demonstrated by income of at least $580 per month or docmentation of 80 hours of work if income cannot be verified
  confidence: high
  notes: Not present in the 2026-06-30/07-01 captures; added to the live page by 2026-10-09.
- id: MT.income_alternative.household_income
  topic: income_alternative
  statement: 'Montana counts household income toward the $580 threshold: a spouse''s or other household member''s earnings count only if the household meets $580; otherwise each person is evaluated individually. Hours cannot be transferred between people.'
  value: 580
  unit: usd
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: mt-dphhs-faq-2026-10-09
    quote: Household income of at least $580 per month. Income may be earned by any member of the individual's household and may include wages or self-employment income.
  - source_id: mt-dphhs-faq-2026-10-09
    quote: An individual cannot count someone else's work hours (or education hours, volunteering hours, etc.) toward their own 80-hour requirement
  confidence: high
  notes: ''
- id: MT.income_alternative.partial_credit
  topic: income_alternative
  statement: If household income is under $580, income divided by the federal minimum wage gives credit hours that count toward the 80 hours; the person supplements with other activities.
  value: null
  unit: null
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: mt-dphhs-faq-2026-10-09
    quote: credit hours are calculated by dividing the individual’s income by the federal minimum wage
  confidence: high
  notes: ''
- id: MT.income_alternative.seasonal
  topic: income_alternative
  statement: Seasonal workers can show average monthly income over the past 6 months of at least $7.25 per hour for 80 hours; otherwise combine activities.
  value: 7.25
  unit: usd
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-06-30
  citations:
  - source_id: mt-dphhs-faq-2026-10-09
    quote: Members can show they met this requirement by checking if their average monthly income over the past 6 months is at least $7.25 per hour for 80 hours.
  confidence: high
  notes: ''
- id: MT.requirement.school_half_time
  topic: requirement
  statement: School counts if enrolled and attending at least half time (at least 6 credit hours) in higher education, career and technical education, high school, or a state-approved GED; fewer than 6 credits convert at 13 hours per credit per month.
  value: 6
  unit: text
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-06-30
  citations:
  - source_id: mt-dphhs-faq-2026-10-09
    quote: half-time enrollment and attendance means that the individual is enrolled in at least 6 credit hours
  confidence: high
  notes: ''
- id: MT.requirement.school_credit_hours_conversion
  topic: requirement
  statement: For less than half-time enrollment, each credit hour counts as 13 hours of monthly activity.
  value: 13
  unit: hours
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-06-30
  citations:
  - source_id: mt-dphhs-faq-2026-10-09
    quote: 13 hours per month will count for each 1 credit completed
  confidence: high
  notes: ''
- id: MT.lookback.application
  topic: lookback
  statement: At application, the person must show the requirement was met (or an exclusion held) for the month before the new application.
  value: 1
  unit: months
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-06-30
