# Montana Medicaid community engagement fact pack
jurisdiction: MT
name: Montana
facts:
- id: MT.start_date.new_applicants
  topic: timeline
  statement: Montana community engagement requirement applies to all new Medicaid Expansion applications on and after July 1, 2026.
  value: '2026-07-01'
  unit: date
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-06-30
  citations:
  - source_id: mt-dphhs-faq-2026-10-09
    quote: 'For new applicants: All new applications for Medicaid Expansion on and after July 1, 2026, will be required to meet the community engagement requirement through qualified activities, unless they have a verified exclusion.'
  - source_id: mt-dphhs-news-2026-06-30
    quote: new Medicaid Expansion community engagement requirements will take effect July 1, 2026
  confidence: high
  notes: ''
- id: MT.start_date.existing_clients
  topic: timeline
  statement: Existing clients must show compliance at their next scheduled redetermination; cases with a redetermination date of August 31, 2026 are first.
  value: '2026-08-31'
  unit: date
  effective_from: 2026-08-31
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: mt-dphhs-faq-2026-10-09
    quote: compliance will be required at your next scheduled redetermination. Cases with a redetermination date of August 31, 2026 will be the first to be required to meet the community engagement requirement.
  confidence: high
  notes: ''
- id: MT.timeline.grace_period
  topic: timeline
  statement: From July through September 2026 DPHHS reviews community engagement at applications and redeterminations but does not deny or disenroll anyone for not meeting it.
  value: '2026-07-01'
  unit: date
  effective_from: 2026-07-01
  effective_to: 2026-09-30
  known_from: 2026-06-30
  citations:
  - source_id: mt-dphhs-faq-2026-06-30
    quote: From July through September 2026, DPHHS will review community engagement for applications and redeterminations, but people will not be denied coverage or disenrolled for not meeting the requirement during this time.
  confidence: high
  notes: ''
- id: MT.timeline.enforcement_start
  topic: timeline
  statement: Starting October 2026 people who do not meet the requirement may be denied coverage or disenrolled.
  value: '2026-10-01'
  unit: date
  effective_from: 2026-10-01
  effective_to: null
  known_from: 2026-06-30
  citations:
  - source_id: mt-dphhs-faq-2026-06-30
    quote: Starting in October 2026, DPHHS will continue to review community engagement for applications and redeterminations, and people who do not meet the requirement may be denied coverage or disenrolled.
  confidence: high
  notes: ''
- id: MT.timeline.legal_basis_spa
  topic: process
  statement: Montana implements through a State Plan Amendment after CMS advised it could do so under H.R. 1; its 1115 waiver is still pending approval.
  value: null
  unit: null
  effective_from: 2026-07-01
  effective_to: null
  known_from: 2026-10-09
  citations:
  - source_id: mt-dphhs-faq-2026-10-09
    quote: In 2026, CMS advised Montana that it could implement the community engagement requirement under H.R. 1 (the One Big Beautiful Bill Act) through a State Plan Amendment
  confidence: high
  notes: ''
