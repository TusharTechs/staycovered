  confidence: high
  notes: ''
- id: MT.lookback.exceptions_hardships
  topic: lookback
  statement: 'Exceptions and short-term hardships count only for the months they apply: at application for the month before; at redetermination for at least 3 months, with any remainder met by reporting activity hours.'
