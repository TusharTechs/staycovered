# Iowa IHAWP community engagement requirements fact pack
jurisdiction: IA
name: Iowa
facts:
- id: IA.start_date.new_applicants
  topic: timeline
  statement: Iowa community engagement requirements take effect December 1, 2026 for individuals who apply for IHAWP on or after that date.
  value: '2026-12-01'
  unit: date
  effective_from: 2026-12-01
  effective_to: null
  known_from: 2026-09-03
  citations:
  - source_id: ia-hhs-ihawp-cer-page-2026-10-09
    quote: These requirements take effect December 1, 2026, for individuals who apply on or after that date.
  - source_id: ia-hhs-cer-deck-2026-09-03
    quote: Individuals who apply on or after December 1, 2026, must meet CER to be eligible for IHAWP.
  confidence: high
  notes: ''
- id: IA.start_date.current_members
  topic: timeline
  statement: Current IHAWP members must meet the requirement at renewals dated February 2027 or later (first renewal cohort February 2027).
  value: 2027-02
  unit: date
  effective_from: 2027-02-01
  effective_to: null
  known_from: 2026-09-03
  citations:
  - source_id: ia-hhs-ihawp-cer-page-2026-10-09
