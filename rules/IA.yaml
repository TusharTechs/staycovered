    quote: Work in exchange for goods or services (in-kind work)
  - source_id: ia-hhs-member-notice-470-0346-2026-10-09
    quote: 'Work: This includes full or part-time work, self-employment, or seasonal work.'
  confidence: high
  notes: ''
- id: IA.requirement.education
  topic: requirement
  statement: Education counts if enrolled at least half-time in high school/GED, community college, vocational/technical school, 4-year college, or graduate program.
  value: null
  unit: null
  effective_from: 2026-12-01
  effective_to: null
  known_from: 2026-10-09
  citations:
