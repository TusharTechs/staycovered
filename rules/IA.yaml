- id: IA.requirement.community_service
  topic: requirement
  statement: Community service is unpaid work with a structured program for the benefit of the community; it may be court ordered; not partisan, not benefiting specific individuals, not purely recreational.
  value: null
  unit: null
  effective_from: 2026-12-01
  effective_to: null
  known_from: 2026-10-09
  citations:
