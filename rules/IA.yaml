    quote: Community service hours do not have to be voluntary. They may be court ordered.
  - source_id: ia-hhs-ihawp-cer-page-2026-10-09
    quote: Community service cannot be partisan activities, benefit specific individuals, or be purely recreational in nature.
  confidence: high
  notes: ''
