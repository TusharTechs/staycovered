- id: IA.requirement.hours_80
  topic: requirement
  statement: Must spend at least 80 hours each month on one or more of work, job training, education, community service (can be combined).
  value: 80
  unit: hours
  effective_from: 2026-12-01
  effective_to: null
  known_from: 2026-07-02
  citations:
  - source_id: ia-hhs-ihawp-cer-page-2026-10-09
    quote: 'you must spend at least 80 hours each month on one or more of these activities:'
  - source_id: ia-hhs-ihawp-cer-page-2026-10-09
    quote: You can combine different activities to reach your 80 hours.
  confidence: high
  notes: ''
- id: IA.income_alternative.580
  topic: income_alternative
  statement: Earning at least $580 per month (federal minimum wage basis) meets the work requirement; seasonal income is averaged over six months.
  value: 580
  unit: usd
  effective_from: 2026-12-01
  effective_to: null
  known_from: 2026-07-02
  citations:
  - source_id: ia-hhs-ihawp-cer-page-2026-10-09
    quote: 'Work: Work for 80 hours per month or earn at least $580 per month (based on federal minimum wage).* Income from seasonal work may be averaged over six months.'
  confidence: high
  notes: ''
- id: IA.requirement.work_types
  topic: requirement
  statement: Work can be paid, in-kind (goods/services), or unpaid work; self-employment and seasonal work count.
  value:
  - paid
  - in-kind
  - unpaid
  - self-employment
  - seasonal
  unit: text
  effective_from: 2026-12-01
  effective_to: null
  known_from: 2026-10-09
  citations:
