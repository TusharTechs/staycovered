open_questions:
- No Iowa verification matrix or document list per activity found; "letter telling you what to send" is the only description.
- What happens when the 30-Day Notice of Non-Compliance period ends (loss date, cure steps) is not described in captured sources.
- The Iowa medically frail condition list/process and documentation standard are not published in captured sources (page says documentation may be required).
- Wayback captures of the Iowa page between 2026-05-10 and 2026-09-16 (none exist per CDX) and between 2026-09-16 and 2026-10-09 were not available, so exact change dates are unknown.
