[project]
name = "staycovered"
version = "0.1.0"
description = "Medicaid work-requirement navigator copilot grounded in official rules as of a date (Nemotron on Nebius Token Factory + Tavily)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "reportlab>=4.2",
  "tavily-python>=0.5",
  "rapidfuzz>=3.14.6",
  "anthropic>=1.13.0",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
