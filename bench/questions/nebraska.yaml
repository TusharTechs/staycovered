- id: ne-0059
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: notice_cure
  drift_sensitive: false
  question: "A client received a Medicaid Verification of Compliance Notice from DHHS. How can she respond, and should she send her original documents?"
  reference_answer: "She can respond by scanning the QR code in the notice, through iServe online, by mail, by phone, or in person at a local DHHS office; the sample notice also lists a fax number. She should not send original documents because DHHS cannot return them."
  rubric:
    - id: c1
      text: "Lists the response channels: QR code in the notice, iServe online, mail, phone, or a local DHHS office."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "Scanning the QR code in your notice"}
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "Visiting iServe online"}
    - id: c2
      text: "Mentions that the notice also allows return by fax or by submitting online at iServe."
      kind: must_include
      citations:
        - {source_id: ne-vocn-sample-eng-2026-04-29, quote: "Provide the requested verifications to the office address listed above or FAX to the number above or submit online at https://iserve.nebraska.gov."}
    - id: c3
      text: "States that she should not send original documents because DHHS cannot return them."
      kind: must_include
      citations:
        - {source_id: ne-vocn-sample-eng-2026-04-29, quote: "Do not send original documents as the Department will not be able to return your documents."}

- id: ne-0060
  split: dev
  jurisdiction: NE
  as_of: 2026-06-10
  category: notice_cure
  drift_sensitive: false
  question: "How long does a client have to respond when DHHS asks for more work-requirement information, and what happens if she misses the deadline?"
  reference_answer: "She must submit the information within 30 days of getting the notice, or she may be denied or lose coverage. The notice itself states a due date for the verification items."
  rubric:
    - id: c1
      text: "States that she must submit the information within 30 days of getting the notice."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "you must submit the information within 30 days of getting the notice, or you may be denied or lose coverage"}
    - id: c2
      text: "States that missing the deadline may result in denial or loss of coverage."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "or you may be denied or lose coverage"}
    - id: c3
      text: "Mentions that the notice lists a specific due date by which verification items must be returned."
      kind: must_include
      citations:
        - {source_id: ne-vocn-sample-eng-2026-04-29, quote: "you must return the following verification items by 06-24-2026"}

- id: ne-0061
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: notice_cure
  drift_sensitive: false
  question: "A client's Medicaid expansion coverage was closed because she did not respond to the work-requirement notice by the due date. Can she just send the missing information to reopen it?"
  reference_answer: "No. The notice and FAQ say that if coverage is denied or closed she will need to meet work requirements and apply for Medicaid again (submit a new application)."
  rubric:
    - id: c1
      text: "States that after coverage is denied or closed she must meet work requirements and apply again (new application)."
      kind: must_include
      citations:
        - {source_id: ne-vocn-sample-eng-2026-04-29, quote: "To qualify for coverage, you will need to meet work requirements and apply for Medicaid again"}
        - {source_id: ne-faq-2026-05-12, quote: "If your coverage is denied or ends, you must meet work requirements and submit a new application to get coverage through Medicaid expansion."}
    - id: c2
      text: "Does not say simply sending the missing information after closure automatically reinstates coverage."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "If your coverage is denied or ends, you must meet work requirements and submit a new application to get coverage through Medicaid expansion."}

- id: ne-0062
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: notice_cure
  drift_sensitive: false
  question: "What does the Nebraska Verification of Compliance Notice say will happen if a client does not return the requested verification by the due date?"
  reference_answer: "Her coverage will be denied or closed. The notice says failure to provide verifications by the due date could result in denial, termination or decrease in benefits."
  rubric:
    - id: c1
      text: "States that failing to respond by the due date could result in denial, termination or decrease in benefits."
      kind: must_include
      citations:
        - {source_id: ne-vocn-sample-eng-2026-04-29, quote: "Failure to provide verifications by 06-24-2026 could result in the denial, termination or decrease in your benefits."}
    - id: c2
      text: "States that coverage will be denied or closed if she does not meet the requirement, has no exemption, or does not respond by the due date."
      kind: must_include
      citations:
        - {source_id: ne-vocn-sample-eng-2026-04-29, quote: "If you fail to qualify for Medicaid coverage because you do not meet Medicaid work requirements, do not have an exemption, or you do not respond to this notice by its due date, your coverage will be denied or closed."}
    - id: c3
      text: "Does not say that ignoring the notice has no effect on coverage."
      kind: must_not_claim
      citations:
        - {source_id: ne-vocn-sample-eng-2026-04-29, quote: "your coverage will be denied or closed"}

