- id: ne-0056
  split: dev
  jurisdiction: NE
  as_of: 2026-06-10
  category: exemption
  drift_sensitive: false
  question: "A new applicant is in an outpatient substance use disorder treatment program. How does she claim the SUD treatment exemption, and what does she have to provide?"
  reference_answer: "A new applicant can self-declare that she is enrolled in an SUD treatment program, giving basic information such as the treatment facility name, a contact name and phone number, and the dates services were provided. No additional documentation is required with the declaration, and declarations are made under penalty of perjury."
  rubric:
    - id: c1
      text: "States that new applicants may self-declare enrollment in an SUD treatment program and provide basic information about the treatment provider (facility name, contact, dates of service)."
      kind: must_include
      citations:
        - {source_id: ne-frail-sud-process-2026-05-12, quote: "Individuals may self-declare that they are medically frail or enrolled in an SUD treatment program."}
        - {source_id: ne-frail-sud-process-2026-05-12, quote: "Name of treatment facility"}
    - id: c2
      text: "States that no additional documentation is required with the declaration form."
      kind: must_include
      citations:
        - {source_id: ne-frail-sud-process-2026-05-12, quote: "No additional documentation is required to be submitted with the individual declaration form."}
    - id: c3
      text: "States that all declarations are made under penalty of perjury."
      kind: must_include
      citations:
        - {source_id: ne-frail-sud-process-2026-05-12, quote: "All declarations are made under penalty of perjury."}

