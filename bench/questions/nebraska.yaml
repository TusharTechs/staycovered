# drift pair with ne-0002
- id: ne-0001
  split: heldout
  jurisdiction: NE
  as_of: 2026-03-15
  category: timeline
  drift_sensitive: true
  question: "When does Nebraska begin applying the Medicaid work requirement to people who are already enrolled in Medicaid expansion?"
  reference_answer: "As of 2026-03-15 DHHS had published that work requirements take effect May 1, 2026 and that this includes people already covered under Medicaid expansion on that date as well as people who apply on or after it. No renewal-based phase-in had been published yet."
  rubric:
    - id: c1
      text: "States that the requirement takes effect May 1, 2026 and covers people already enrolled in Medicaid expansion on that date as well as new applicants."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-03-03, quote: "Work requirements take effect on May 1, 2026. This includes people with Medicaid coverage under Medicaid expansion on this date or people who apply on or after this date."}
    - id: c2
      text: "Does not claim that existing members are checked only at their renewals, starting with eligibility periods ending on or after July 31, 2026 (that schedule was not yet published)."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-03-03, quote: "This includes people with Medicaid coverage under Medicaid expansion on this date or people who apply on or after this date."}

# drift pair with ne-0001
- id: ne-0002
  split: heldout
  jurisdiction: NE
  as_of: 2026-05-20
  category: timeline
  drift_sensitive: true
  question: "When does Nebraska begin applying the Medicaid work requirement to people who are already enrolled in Medicaid expansion?"
  reference_answer: "Existing members are checked at their own regular renewals. DHHS first checks members whose coverage periods end on or after July 31, 2026, each in their own renewal month over the next year. Members with May or June 2026 renewals do not have to show compliance until their 2027 renewal."
  rubric:
    - id: c1
      text: "States that DHHS first checks members whose coverage periods end on or after July 31, 2026, each in their own renewal month."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-05-13, quote: "DHHS will first start checking work requirements for members whose coverage periods end on or after July 31, 2026. Each member will be checked in their own renewal month over the next year."}
    - id: c2
      text: "States that members with renewal dates in May or June 2026 do not have to show compliance until their renewal in 2027."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-05-13, quote: "Members with renewal dates in May or June 2026 will not have to show they've met work requirements until their renewal in 2027."}
    - id: c3
      text: "Does not claim that all existing expansion members must prove compliance immediately on May 1, 2026."
      kind: must_not_claim
      citations:
        - {source_id: ne-pr-take-effect-2026-04-30, quote: "Although the requirements take effect May 1, they will not be applied to all expansion members immediately. Reviews will occur during each member's regularly scheduled Medicaid renewal period."}

