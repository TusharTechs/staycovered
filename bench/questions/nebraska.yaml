  question: "A client was released from county jail on August 1, 2026 and applied for Medicaid expansion on October 1, 2026. She has no job and no other exemption. Does she have an exemption for the work requirement, and how would she report it?"
  reference_answer: "Yes. The incarceration exemption covers people in jail or recently released within 90 days of a qualifying month. For an applicant the exemption review period is the month she applies (October) or the month before (September), and both fall within 90 days of an August 1 release. She would report previous incarceration on the individual declaration form."
