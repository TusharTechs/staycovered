      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "You are in a household that gets supplemental nutrition assistance program (SNAP) or Temporary Assistance for Needy Families (TANF) benefits and are compliant under certain conditions with work requirements"}
    - id: c2
      text: "Mentions the notice wording: compliant with TANF work rules, or in a SNAP household that is not exempt from work rules."
      kind: must_include
      citations:
        - {source_id: ne-vocn-sample-eng-2026-04-29, quote: "In a SNAP household that is not exempt from work rules"}
    - id: c3
      text: "Does not say that merely receiving SNAP automatically exempts her."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "are compliant under certain conditions with work requirements"}

- id: ne-0055
  split: heldout
  jurisdiction: NE
  as_of: 2026-08-15
  category: exemption
  drift_sensitive: false
  question: "A 24-year-old client aged out of foster care in Kansas at 18 and had Medicaid then. Does she qualify for Nebraska's foster care exemption, and how does she claim it?"
  reference_answer: "Yes. Someone who aged out of foster care, had Medicaid at that time, and is under age 26 does not need to complete work requirement activities, whether she aged out in Nebraska or another state. She should let the Medicaid program know."
  rubric:
    - id: c1
      text: "States that a person who aged out of foster care, had Medicaid when she aged out, and is under 26 does not need to complete work activities."
