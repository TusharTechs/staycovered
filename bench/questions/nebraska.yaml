- id: ne-0058
  split: dev
  jurisdiction: NE
  as_of: 2026-10-01
  category: good_cause
  drift_sensitive: false
  question: "How long do Nebraska's county-based temporary hardship exemptions last, and have the wildfire and severe-weather ones ended?"
  reference_answer: "Per the DHHS table, the Dawson County high-unemployment exemption lasts until Dawson no longer has an unemployment rate over 8% or 1.5 times the national rate. The wildfire emergency (Arthur, Grant, Garden, Lincoln, Morrill) lasted until April 30, 2026 and the severe-weather emergency (eight counties) until May 31, 2026, but whether a person qualifies depends on living there in the stated months."
  rubric:
    - id: c1
      text: "States that the Dawson County exemption lasts until the county no longer has an unemployment rate over 8% or 1.5 times the national rate."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "The temporary hardship exemption will last until Dawson County no longer has an unemployment rate that is over 8% or 1.5 times the national unemployment rate."}
    - id: c2
      text: "States that the wildfire emergency hardship lasted until April 30, 2026 and the severe-weather one until May 31, 2026."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "Lasts Until: April 30, 2026"}
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "Lasts Until: May 31, 2026"}
    - id: c3
      text: "States that qualification depends on which month or months the person lived in the county, per the table."
      kind: must_include
      citations:
