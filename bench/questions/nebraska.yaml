- id: ne-0064
  split: dev
  jurisdiction: NE
  as_of: 2026-10-01
  category: process
  drift_sensitive: false
  question: "What kinds of changes must a Nebraska Medicaid member report to DHHS, and how can she report them?"
  reference_answer: "She must report changes that impact eligibility, including changes in income, home address, work status, and household size (such as marriage, divorce, pregnancy, or adoption). She can report in person, online, by phone, or by mail."
  rubric:
    - id: c1
      text: "Lists changes in income, home address, work status, and household size as reportable changes."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "you must report changes that impact your eligibility. This can include changes in income, home address, work status, and household size"}
    - id: c2
      text: "States she can report in person, online, by phone, or through the mail."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "You can provide this information to DHHS in person, online, by phone, or through the mail."}

- id: ne-0065
  split: dev
  jurisdiction: NE
  as_of: 2026-06-10
  category: process
  drift_sensitive: false
  question: "Once a client is enrolled in Nebraska Medicaid expansion, will DHHS check her work requirement every month?"
  reference_answer: "No. A first-time applicant is checked when she applies. After enrollment DHHS only checks at each regularly scheduled renewal."
  rubric:
    - id: c1
      text: "States that after enrollment DHHS only checks at each regularly scheduled renewal."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "After you’re enrolled, DHHS will only check that you’re meeting work requirements or have an exemption at each regularly scheduled renewal."}
    - id: c2
      text: "States that first-time applicants are checked when they apply."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "If you’re applying for coverage for the first time, DHHS will check that you’re meeting work requirements or have an exemption when you apply."}
    - id: c3
      text: "Does not say members must report hours to DHHS every month."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "DHHS will only check that you’re meeting work requirements or have an exemption at each regularly scheduled renewal."}

- id: ne-0066
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: process
  drift_sensitive: false
  question: "How does Nebraska decide which medical conditions make someone medically frail, and does an existing member with a qualifying diagnosis have to apply for the exemption?"
  reference_answer: "DHHS staff reviewed thousands of diagnosis and procedure codes (ICD-10, CPT, HCPCS). For existing enrollees, DHHS reviews medical claims data about 90 days before the eligibility period ends; if qualifying indicators are found the person is treated as exempt without taking action. If there are no qualifying claims she submits a self-declaration."
  rubric:
    - id: c1
      text: "States that DHHS reviewed thousands of diagnosis and procedure codes, including ICD-10, CPT, and HCPCS codes."
      kind: must_include
      citations:
        - {source_id: ne-frail-sud-process-2026-05-12, quote: "DHHS staff have reviewed thousands of medical diagnosis and procedure codes, including ICD-10, CPT, and HCPCS codes"}
    - id: c2
      text: "States that if claims data show qualifying conditions the existing member is treated as exempt without taking additional action."
      kind: must_include
      citations:
        - {source_id: ne-frail-sud-process-2026-05-12, quote: "the individual will be treated as exempt without needing to take additional action"}
    - id: c3
      text: "States that without qualifying claims the member must submit a self-declaration."
      kind: must_include
      citations:
        - {source_id: ne-frail-sud-process-2026-05-12, quote: "the individual will need to submit a self-declaration and provide basic information about their medically frail condition or SUD treatment provider."}

- id: ne-0067
  split: dev
  jurisdiction: NE
  as_of: 2026-06-10
  category: calculation
  drift_sensitive: false
  question: "In June 2026 a Nebraska Medicaid expansion member worked 40 hours at $11.25 an hour ($450 total) and also volunteered 30 hours. She has no other activity and no exemption. Does she meet the work requirement for June? Can her $450 be converted into extra hours (about 62 hours at $7.25) and added to her volunteer hours?"
  reference_answer: "No for June. Her hours total 40 + 30 = 70, below 80, and her earnings of $450 are below $580. Nebraska's published rules offer hours (80, combining activities) or $580 earnings as separate routes; they do not describe converting income into hours to combine with other activities."
  rubric:
    - id: c1
      text: "Calculates 70 combined hours (40 working + 30 volunteering), which is below 80, and $450 earnings, below $580, so June is not met."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "Or, you can combine any of these activities to get to 80 hours in a calendar month."}
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "You can also meet work requirements if you are working and earn $580 in a calendar month."}
    - id: c2
      text: "Does not claim that Nebraska lets income be converted into hours (for example $450 / $7.25 = about 62 hours) and added to volunteer hours to reach 80."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "You can also meet work requirements if you are working and earn $580 in a calendar month. This is equal to 80 hours worked at the current federal minimum wage."}
    - id: c3
      text: "States that the volunteer hours are reported on the individual declaration form (IDF)."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "To report volunteer hours, you must complete the individual declaration form (IDF)."}

- id: ne-0068
  split: heldout
  jurisdiction: NE
  as_of: 2026-07-20
  category: calculation
  drift_sensitive: false
  question: "A client applied for Medicaid expansion on July 8, 2026. She worked 30 hours in June 2026 and 90 hours in July 2026. She has no exemption or hardship. Does she meet Nebraska's work requirement for this application?"
  reference_answer: "No. For work activities the review period is the calendar month before applying, which is June 2026, when she worked only 30 hours (below 80). July hours, the month she applied, are not the review month for activities."
  rubric:
    - id: c1
      text: "Identifies June 2026 (the calendar month before applying) as the review month for work activities."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "If you are working, going to school, participating in a work program, volunteering, or earning at least $580, the work requirement review period is the calendar month before you apply."}
    - id: c2
      text: "Concludes she does not meet the requirement because June has only 30 hours (below 80) and no exemption or hardship applies."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "You must spend at least 80 hours in at least one calendar month doing one of these activities"}
    - id: c3
      text: "Does not count her July hours (the month of application) toward the work activity requirement."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "the work requirement review period is the calendar month before you apply"}

- id: ne-0069
  split: heldout
  jurisdiction: NE
  as_of: 2026-09-20
  category: calculation
  drift_sensitive: false
  question: "A Nebraska Medicaid expansion member's last renewal was November 30, 2025 and her next eligibility period ends November 30, 2026. She had no work activity in any month except July 2026, when she worked 100 hours. She has no exemption. Is she compliant at the November 2026 renewal?"
  reference_answer: "Yes. Her eligibility period ends after July 31, 2026, so she is checked at that renewal. The review period is 12 months and one calendar month of 80+ hours since her last renewal is enough; July 2026 (100 hours) satisfies it."
  rubric:
    - id: c1
      text: "States that the 12-month review period requires activity in at least one calendar month since the last renewal."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "you must complete work requirement activities, qualify for an exemption, or have a temporary hardship during at least one calendar month since your last renewal."}
    - id: c2
      text: "Concludes she is compliant because July 2026 with 100 hours meets the 80-hour threshold."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "You must spend at least 80 hours in at least one calendar month doing one of these activities"}
    - id: c3
      text: "Does not say she must have met the requirement in every month of the year."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "If Medicaid can confirm you met the requirement for at least one qualifying month, you will be considered compliant for the full eligibility period."}

- id: ne-0070
  split: dev
  jurisdiction: NE
  as_of: 2026-07-20
  category: calculation
  drift_sensitive: false
  question: "At a community college, full-time status is 12 credit hours. Student A is enrolled in 6 credit hours and Student B in 5 credit hours. Neither works or volunteers and neither has an exemption. Using Nebraska's published half-time definition, which student meets the work requirement through school alone?"
  reference_answer: "Student A. Half-time means enrollment in at least half of the program's full-time status: half of 12 is 6, so 6 credits qualifies and 5 does not. Student B is less than half-time and would need to combine school with other activities to reach 80 hours."
  rubric:
    - id: c1
      text: "Applies the definition that half-time is at least half of the program's full-time status (6 of 12 credit hours)."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "Half-time means enrollment in at least half of the program’s full-time status."}
    - id: c2
      text: "Concludes Student A (6 credits) meets the requirement through school and Student B (5 credits) does not alone."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "If you are attending an accredited school or participating in a registered apprenticeship at least half-time, you will meet work requirements."}
    - id: c3
      text: "States that less-than-half-time school can be combined with other activities to reach 80 hours."
      kind: must_include
      citations:
        - {source_id: ne-onepager-2026-05-12, quote: "If you are attending school less than half-time, you can combine it with other work requirement activities to reach 80 hours."}

- id: ne-0071
  split: heldout
  jurisdiction: NE
  as_of: 2026-09-20
  category: calculation
  drift_sensitive: false
  question: "Two existing Medicaid expansion members both lived in Morrill County in April 2026 (wildfire emergency). Member X has a Medicaid renewal in March 2027; Member Y has a renewal in April 2027. Using DHHS's county hardship table, which one qualifies for the wildfire hardship exemption?"
  reference_answer: "Member X qualifies: someone who lived in a wildfire county during April 2026 qualifies if the renewal falls in any month between July 2026 and March 2027. Member Y's April 2027 renewal is outside that window, so the wildfire exemption does not apply to Y (for April-only residence)."
  rubric:
    - id: c1
      text: "States that Morrill is in the wildfire emergency group (March 1 to April 30, 2026)."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "Arthur Grant Garden Lincoln Morrill Started: March 1, 2026"}
    - id: c2
      text: "States that living there in April 2026 qualifies an existing member with a renewal in any month between July 2026 and March 2027, so X (March 2027) qualifies."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "You also qualify for this exemption if you lived in one of these counties during April 2026 and have a Medicaid renewal in any month between July 2026 and March 2027."}
    - id: c3
      text: "Does not say Member Y (April 2027 renewal) qualifies under the wildfire exemption."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "have a Medicaid renewal in any month between July 2026 and March 2027"}

- id: ne-0072
  split: dev
  jurisdiction: NE
  as_of: 2026-09-20
  category: calculation
  drift_sensitive: false
  question: "Two new applicants both lived in Thurston County in May 2026. Applicant X applied for Medicaid expansion on June 20, 2026 and Applicant Y applied on July 2, 2026. Using DHHS's county hardship table, which one qualifies for the severe-weather hardship exemption?"
  reference_answer: "Applicant X qualifies: new applicants qualify if they lived in one of the severe-weather counties during May 2026 and applied in June 2026. Applicant Y applied in July, so the May hardship does not fall in her review month (June) and that exemption does not apply."
  rubric:
    - id: c1
      text: "States that new applicants qualify if they lived in a listed county during May 2026 and applied for Medicaid in June 2026."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "You qualify for this exemption if you lived in one of these counties during May 2026 and you applied for Medicaid in June 2026."}
    - id: c2
      text: "Concludes X (applied June 20) qualifies and Y (applied July 2) does not qualify under this exemption."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "Started: May 1, 2026 Lasts Until: May 31, 2026"}
    - id: c3
      text: "Does not say Applicant Y qualifies for the severe-weather hardship exemption."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-09-15, quote: "you applied for Medicaid in June 2026"}

- id: ne-0073
  split: heldout
  jurisdiction: NE
  as_of: 2026-08-15
  category: calculation
  drift_sensitive: false
  question: "A self-employed designer worked 70 hours on her business in July 2026, and the business ran a $200 loss for the month. She also volunteered 15 hours that month. She has no exemption. Does she meet Nebraska's work requirement for July?"
  reference_answer: "Yes. Self-employment hours count even if the business operates at a loss, and activities can be combined: 70 + 15 = 85 hours, which is at least 80 in a calendar month. Volunteer hours are reported with the individual declaration form (IDF)."
  rubric:
    - id: c1
      text: "States that self-employment hours count even if the business operates at a loss."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "you can work 80 hours in a qualifying month as self-employed even if your business operates at a loss during a qualifying calendar month."}
    - id: c2
      text: "Calculates 70 + 15 = 85 combined hours, meeting the 80-hour threshold."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-08-01, quote: "Or, you can combine any of these activities to get to 80 hours in a calendar month."}
    - id: c3
      text: "Does not say the business loss disqualifies the hours or that she must instead show $580 profit."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "even if your business operates at a loss"}

- id: ne-0074
  split: dev
  jurisdiction: NE
  as_of: 2026-08-05
  category: calculation
  drift_sensitive: false
  question: "Three Medicaid expansion members have eligibility periods ending on different dates: Member A on June 30, 2026, Member B on August 31, 2026, and Member C on December 31, 2026. Which of them must show Nebraska work-requirement compliance at that renewal?"
  reference_answer: "Members B and C must, because DHHS checks members whose coverage periods end on or after July 31, 2026, each in their own renewal month. Member A has a June 2026 renewal, so she does not have to show compliance until her renewal in 2027."
  rubric:
    - id: c1
      text: "States that members whose coverage periods end on or after July 31, 2026 are checked at their own renewal, so B (Aug 31) and C (Dec 31) must show compliance."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-08-01, quote: "DHHS will first start checking work requirements for members whose coverage periods end on or after July 31, 2026. Each member will be checked in their own renewal month over the next year."}
    - id: c2
      text: "States that Member A, with a June 2026 renewal, does not have to show compliance until her 2027 renewal."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-08-01, quote: "Members with renewal dates in May or June 2026 will not have to show they've met work requirements until their renewal in 2027."}
    - id: c3
      text: "Does not say Member A must show compliance at the June 2026 renewal."
      kind: must_not_claim
      citations:
        - {source_id: ne-pr-take-effect-2026-04-30, quote: "Members with renewal dates in May or June 2026 will not be subject to the requirements."}

- id: ne-0075
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: calculation
  drift_sensitive: false
  question: "Client A worked 65 hours in a month at $9.00 an hour. Client B worked 70 hours in the same month at $8.00 an hour. Neither had other activities or exemptions. Using Nebraska's published rules, which client meets the work requirement for that month?"
  reference_answer: "Client A meets it: $9.00 x 65 = $585, which is at least $580, so she qualifies by income even though she worked fewer than 80 hours. Client B earned $8.00 x 70 = $560, below $580, and worked 70 hours, below 80, so she does not meet it that month."
  rubric:
    - id: c1
      text: "Calculates A's earnings as $585 (65 x $9.00), at least $580, so A meets the requirement despite fewer than 80 hours."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "If you earn at least $580 in a calendar month, you meet the work requirement even if you work fewer than 80 hours."}
    - id: c2
      text: "Calculates B's earnings as $560 and 70 hours, which is below both $580 and 80 hours, so B does not meet it."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "You can also meet work requirements if you are working and earn $580 in a calendar month."}
    - id: c3
      text: "Does not say B qualifies by rounding 70 hours up to 80 or by converting her $560 earnings into 80 hours."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "You must spend at least 80 hours in at least one calendar month doing one of these activities"}

