      text: "States that work requirements only affect the person who must meet them and that the child's Medicaid will not be affected."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "Work requirements only affect the person who must meet them. For example, if a parent is eligible through Medicaid expansion but loses coverage because the parent is not meeting work requirements, the child’s Medicaid will not be affected."}
    - id: c2
      text: "Does not say the child or other household members lose coverage because of the parent's noncompliance."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "the child’s Medicaid will not be affected."}

- id: ne-0040
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: applicability
  drift_sensitive: false
  question: "My 45-year-old client has Medicaid because of a disability, not through expansion. Does Nebraska's work requirement apply to her?"
  reference_answer: "No. Work requirements only apply to people applying for or already covered through Medicaid expansion; the expansion group is adults 19-64 who are not pregnant, do not have a disability, and are not on Medicare."
  rubric:
    - id: c1
      text: "States that work requirements only apply to people applying for or covered through Medicaid expansion."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "Work requirements only apply to you if you are applying for or already have Medicaid coverage through Medicaid expansion."}
    - id: c2
      text: "States that the expansion group does not include people who have a disability."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "Do not have a disability"}
    - id: c3
      text: "Does not say the requirement applies to all Nebraska Medicaid members regardless of category."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "Work requirements only apply to you if you are applying for or already have Medicaid coverage through Medicaid expansion."}

- id: ne-0041
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: requirement
  drift_sensitive: false
  question: "A client has no paid job, but in one month she volunteered 40 hours and attended a job-skills program for 40 hours. Does she meet Nebraska's work requirement, and how does she report it?"
  reference_answer: "Yes. Activities can be combined to reach 80 hours in a calendar month (40 + 40 = 80). To report volunteer hours and work-program hours she must complete the individual declaration form (IDF)."
  rubric:
    - id: c1
      text: "States that activities can be combined to reach 80 hours in a calendar month, so 40 + 40 hours meets the requirement."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "Or, you can combine any of these activities to get to 80 hours in a calendar month."}
    - id: c2
      text: "States that volunteer hours are reported with the individual declaration form (IDF)."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "To report volunteer hours, you must complete the individual declaration form (IDF)."}
    - id: c3
      text: "States that job-skills or training program hours are also reported with the IDF."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "To report job-skills or training programs hours, you must complete the individual declaration form (IDF)."}

- id: ne-0042
  split: dev
  jurisdiction: NE
  as_of: 2026-06-10
  category: requirement
  drift_sensitive: false
  question: "My client spends about 30 hours a week searching for a job on her own. Does job searching count toward Nebraska's 80 hours?"
  reference_answer: "No. Job searching outside of an approved program does not count. Participation in an organized work program that helps people prepare for, find, or keep a job can count."
  rubric:
    - id: c1
      text: "States that job searching outside of an approved program does not count."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "No. Job searching outside of an approved program does not count."}
    - id: c2
      text: "States that an organized work program that helps people prepare for, find, or keep a job can count as a work-program activity."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "A work program is an organized program that helps people prepare for, find, or keep a job."}
    - id: c3
      text: "Does not say that self-directed job search hours count toward the 80 hours."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "Job searching outside of an approved program does not count."}

- id: ne-0043
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: requirement
  drift_sensitive: false
  question: "My client goes to Alcoholics Anonymous meetings three times a week. Does that make her exempt as someone in a drug or alcohol treatment program?"
  reference_answer: "No. Attending Alcoholics Anonymous or similar drug and alcohol support groups does not count as participating in a drug addiction or alcohol treatment program for the work requirement exemption."
  rubric:
    - id: c1
      text: "States that attending AA or similar support groups does not count as a treatment program for this purpose."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "No, attending Alcoholics Anonymous (AA) or similar drug and alcohol support groups does not count as participating in a drug addiction or alcoholic treatment program to meet work requirements."}
    - id: c2
      text: "Does not say AA attendance alone qualifies her for the treatment-program exemption."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "attending Alcoholics Anonymous (AA) or similar drug and alcohol support groups does not count"}

- id: ne-0044
  split: dev
  jurisdiction: NE
  as_of: 2026-06-10
  category: income_alternative
  drift_sensitive: false
  question: "Where does Nebraska's $580 figure come from, and can a client who works fewer than 80 hours in a month still meet the requirement with it?"
  reference_answer: "$580 per calendar month equals 80 hours at the federal minimum wage. A person who earns at least $580 in a calendar month meets the requirement even if she worked fewer than 80 hours. Seasonal workers can qualify with a six-month average monthly income of at least $580."
  rubric:
    - id: c1
      text: "States that $580 in a calendar month equals 80 hours worked at the current federal minimum wage."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "You can also meet work requirements if you are working and earn $580 in a calendar month. This is equal to 80 hours worked at the current federal minimum wage."}
    - id: c2
      text: "States that earning at least $580 meets the requirement even with fewer than 80 hours worked."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "If you earn at least $580 in a calendar month, you meet the work requirement even if you work fewer than 80 hours."}
    - id: c3
      text: "States that seasonal workers can qualify with an average monthly income over the last six months of at least $580."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "You can also meet work requirements if your average monthly income from working over the last six months from seasonal work is at least $580, regardless of the number of hours worked."}

- id: ne-0045
  split: heldout
  jurisdiction: NE
  as_of: 2026-09-20
  category: income_alternative
  drift_sensitive: false
  question: "My client earns $300 a month at a part-time job and her husband earns $2,500. Will DHHS add his income to hers so she clears the $580 test?"
  reference_answer: "Not something to promise. Nebraska's FAQ says Medicaid will count the member's income and may also count household members' income in some cases, and refers to state regulations at 477 NAC 16. It does not say a spouse's income always counts, or never counts."
  rubric:
    - id: c1
      text: "States that others' household income may be counted in some cases and points to 477 NAC 16."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "Medicaid will count your income and may also count the income from others in your household in some cases."}
    - id: c2
      text: "Does not state that the spouse's income definitely counts toward the $580 test."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "may also count the income from others in your household in some cases"}
    - id: c3
      text: "Does not state that the spouse's income definitely does not count."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "It may count in some cases. For more information, see state regulations in 477 NAC 16."}

- id: ne-0046
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: lookback
  drift_sensitive: false
  question: "I read that federal rules let states require a new applicant to show compliance for up to three months before applying. Does a new Nebraska applicant need to show three months of work?"
  reference_answer: "No. In Nebraska the review period for an applicant's work, school, volunteering or $580 income is the calendar month before applying. For an exemption it can be the month of application or the month before."
  rubric:
    - id: c1
      text: "States that Nebraska's review period for activities and income is the calendar month before applying (one month)."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "If you are working, going to school, participating in a work program, volunteering, or earning at least $580, the work requirement review period is the calendar month before you apply."}
    - id: c2
      text: "Does not say a Nebraska applicant must show three consecutive months of activity."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "If you are working, going to school, participating in a work program, volunteering, or earning at least $580, the work requirement review period is the calendar month before you apply."}

- id: ne-0047
  split: dev
  jurisdiction: NE
  as_of: 2026-08-15
  category: lookback
  drift_sensitive: false
  question: "For an existing Nebraska Medicaid expansion member at renewal, how far back does DHHS look, and how many months does she have to meet the requirement?"
  reference_answer: "The review period is 12 months. She must complete work requirement activities, qualify for an exemption, or have a temporary hardship during at least one calendar month since her last renewal."
  rubric:
    - id: c1
      text: "States that the review period for existing members is 12 months."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-08-01, quote: "If you're already on Medicaid, the work requirement review period is 12 months."}
    - id: c2
      text: "States that she needs at least one calendar month since her last renewal in which she did activities, had an exemption, or had a temporary hardship."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-08-01, quote: "you must complete work requirement activities, qualify for an exemption, or have a temporary hardship during at least one calendar month since your last renewal."}
    - id: c3
      text: "Does not say she must meet the requirement in every month of the 12."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-08-01, quote: "during at least one calendar month since your last renewal."}

- id: ne-0048
  split: dev
  jurisdiction: NE
  as_of: 2026-08-15
  category: lookback
  drift_sensitive: false
  question: "A member worked 90 hours in one month but then lost her job. Is she out of compliance for the rest of her eligibility period?"
  reference_answer: "No. If Medicaid can confirm she met the requirement in at least one qualifying month, she is considered compliant for the full eligibility period."
  rubric:
    - id: c1
      text: "States that confirming one qualifying month makes her compliant for the full eligibility period."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "If Medicaid can confirm you met the requirement for at least one qualifying month, you will be considered compliant for the full eligibility period."}
    - id: c2
      text: "Does not say she must show 80 hours or $580 in every month."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "If Medicaid can confirm you met the requirement for at least one qualifying month, you will be considered compliant for the full eligibility period."}

- id: ne-0049
  split: heldout
  jurisdiction: NE
  as_of: 2026-07-10
  category: requirement
  drift_sensitive: false
  question: "A client runs a small landscaping business. She worked about 90 hours in her business in June but the business lost money that month. Can that count for the work requirement?"
  reference_answer: "Yes. A self-employed person can meet the requirement by working 80 hours in a qualifying month even if the business operates at a loss, or by earning $580 in a qualifying calendar month."
  rubric:
    - id: c1
      text: "States that 80 hours of self-employment in a qualifying month can count even if the business operates at a loss."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "Or, you can work 80 hours in a qualifying month as self-employed even if your business operates at a loss during a qualifying calendar month."}
    - id: c2
      text: "Does not say a business loss disqualifies her from meeting the requirement through hours worked."
      kind: must_not_claim
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "even if your business operates at a loss during a qualifying calendar month"}

- id: ne-0050
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: verification
  drift_sensitive: false
  question: "A client's renewal is coming up. Should she mail DHHS her pay stubs and school transcripts now to prove she meets the work requirement?"
  reference_answer: "No. She should not send new documents unless Medicaid asks her to. If DHHS does not send a request she does not have to send additional work-requirement information, but she must still report changes that could affect eligibility."
  rubric:
    - id: c1
      text: "States that she should not send new documents unless Medicaid asks for them."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "No. Do not send new documents unless Medicaid asks you to."}
    - id: c2
      text: "States that she must still report changes that could affect her eligibility."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "You must still report changes that could affect your eligibility."}
    - id: c3
      text: "Does not say that sending documents in advance is required to keep coverage."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "If DHHS does not send you a request, then you do not have to send additional information about work requirements."}

- id: ne-0051
  split: dev
  jurisdiction: NE
  as_of: 2026-06-10
  category: verification
  drift_sensitive: false
  question: "Does a Nebraska Medicaid member have to prove she meets the work requirement herself, or does DHHS check first?"
  reference_answer: "DHHS first uses information it already has. If it can verify compliance it sends an approval notice. If not, it sends a notice describing what is needed plus a declaration form to complete and return."
  rubric:
    - id: c1
      text: "States that DHHS first uses information it already has to check whether the person meets work requirements and sends an approval notice if verified."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "The Department of Health and Human Services (DHHS) will use information we already have to check if you already meet work requirements. If we can verify that you already meet work requirements, we'll send you an approval notice."}
    - id: c2
      text: "States that if information is insufficient DHHS sends a notice describing what is needed and a declaration form to return."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "We'll send you a notice describing the information we need and a declaration form you must complete and return to DHHS."}
    - id: c3
      text: "Does not say every member must submit proof up front before DHHS checks its own records."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-06-03, quote: "will use information we already have to check if you already meet work requirements."}

- id: ne-0052
  split: heldout
  jurisdiction: NE
  as_of: 2026-06-10
  category: verification
  drift_sensitive: false
  question: "Which situations is the Nebraska Medicaid Individual Declaration Form (MLTC-118) meant for, and does a client with an ordinary paid job use it to report her hours?"
  reference_answer: "The form (MLTC-118, 5/2026) should only be used for declaring volunteering, education or work programs, caring for a person with a disability, previous incarceration, medical exemptions, and VA disability ratings. Paid work is first checked from information DHHS has; if it cannot verify, it may ask for documents showing hours worked or income."
  rubric:
    - id: c1
      text: "Lists the situations the declaration form is for: volunteering, education or work programs, caring for a person with a disability, previous incarceration, medical exemptions, and VA disability ratings."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-05-13, quote: "This form should only be used for declaring: volunteering, education or work programs, caring for a person with a disability, previous incarceration, medical exemptions, and VA disability ratings."}
    - id: c2
      text: "States that for paid work DHHS first checks information it has and may ask for documents showing hours worked or income."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "If DHHS cannot verify this information, we may ask for documents that show your number of hours worked or income."}
    - id: c3
      text: "Identifies the form as MLTC-118 (5/2026), the Medicaid Work Requirements Individual Declaration Form."
      kind: must_include
      citations:
        - {source_id: ne-declaration-mltc118-2026-05-29, quote: "Medicaid Work Requirements - Individual Declaration Form"}
        - {source_id: ne-declaration-mltc118-2026-05-29, quote: "MLTC-118 5/2026"}

- id: ne-0053
  split: dev
  jurisdiction: NE
  as_of: 2026-08-15
  category: exemption
  drift_sensitive: false
  question: "A client gave birth in March 2026 and had Nebraska Medicaid during her pregnancy. A friend says the postpartum work-requirement exemption lasts only 60 days. Her renewal is in September 2026. Is she exempt?"
  reference_answer: "Yes, she should be exempt. Nebraska's exemption covers people who are pregnant or up to 12 months postpartum if they had Medicaid when they were pregnant, so a September 2026 renewal (about 6 months after a March birth) falls within the window. The 60-day claim is wrong for Nebraska."
  rubric:
    - id: c1
      text: "States that the exemption runs up to 12 months postpartum for someone who had Medicaid while pregnant."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-08-01, quote: "You are pregnant or are up to 12 months postpartum (and you had Medicaid when you were pregnant)"}
    - id: c2
      text: "Concludes that a September 2026 renewal, about six months after a March 2026 birth, falls within the exemption period."
      kind: must_include
      citations:
        - {source_id: ne-dhhs-wr-page-2026-08-01, quote: "You are pregnant or are up to 12 months postpartum (and you had Medicaid when you were pregnant)"}
    - id: c3
      text: "Does not say the postpartum exemption ends after 60 days."
      kind: must_not_claim
      citations:
        - {source_id: ne-dhhs-wr-page-2026-08-01, quote: "up to 12 months postpartum"}

- id: ne-0054
  split: dev
  jurisdiction: NE
  as_of: 2026-06-10
  category: exemption
  drift_sensitive: false
  question: "My client's household gets SNAP. Is she automatically exempt from Nebraska's Medicaid work requirement?"
  reference_answer: "Not automatically. The exemption is for people in a household that gets SNAP or TANF benefits and are compliant under certain conditions with work requirements. The notice describes it as being compliant with TANF work rules or in a SNAP household that is not exempt from work rules."
  rubric:
    - id: c1
      text: "States that the SNAP/TANF exemption applies to people in a household getting SNAP or TANF who are compliant under certain conditions with work requirements."
