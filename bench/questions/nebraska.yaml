    - id: c2
      text: "States that the foster care can be in Nebraska or another state, and that she should let the Medicaid program know."
      kind: must_include
      citations:
        - {source_id: ne-faq-2026-05-12, quote: "Let the Medicaid program know if you aged out of the foster care system, either in Nebraska or in another state."}
    - id: c3
