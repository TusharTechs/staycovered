- id: fed-0047
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: lookback
  drift_sensitive: false
  question: "My state said it will check compliance every 3 months instead of only at renewal. Is that allowed, and what period does the client have to show?"
  reference_answer: "Yes. States may verify more frequently than each regularly scheduled redetermination. The client must demonstrate engagement for the period between her most recent demonstration and the date the next demonstration is due."
  rubric:
    - id: c1
      text: "States that states may verify compliance more frequently than at each regularly scheduled redetermination."
      kind: must_include
