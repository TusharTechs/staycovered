# drift pair with fed-0030
- id: fed-0031
  split: dev
  jurisdiction: US
  as_of: 2026-08-15
  category: income_alternative
  drift_sensitive: true
  question: "My client's husband earns $900 a month and she has no income. Does his income count toward the income test for the work requirement?"
  reference_answer: "Yes, if he is in her MAGI household. States must use the individual's MAGI-based income for their MAGI household, i.e. total household income (earned plus countable unearned). Household income of $900 is at least $580 (2026: $7.25 x 80), so the income test is met."
  rubric:
    - id: c1
      text: "States that the income test uses MAGI-based income for the person's MAGI household (the total income of everyone in the household), not just her own earnings."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(2) The agency must determine the monthly income based on the individual's MAGI-based income, for their MAGI-based household, as defined at Sec. 435.603"}
        - {source_id: fed-ifr-2026-06-03, quote: "Under Sec. 435.603(d) and (f), household income is the total income of everyone in the individual's household."}
    - id: c2
      text: "States the 2026 threshold is $580 per month ($7.25 x 80), so household income of $900 meets it."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "multiplied by 80 equals $580."}
    - id: c3
      text: "Does not claim the threshold is based on the individual's own earnings only."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "States must determine individuals' Medicaid financial eligibility using household income, which includes the income of every individual included in the individual's household."}

- id: fed-0032
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: income_alternative
  drift_sensitive: false
  question: "How is the monthly income threshold calculated, and what is it in 2026?"
  reference_answer: "It is the federal minimum wage (29 U.S.C. 206(a)(1)(C)) multiplied by 80 hours. With the 2026 federal minimum wage of $7.25, the threshold is $580 per month. Income at or above the threshold meets the requirement for that month."
  rubric:
    - id: c1
      text: "States the formula: federal minimum wage multiplied by 80 hours."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(1) An applicable individual demonstrates community engagement for a month if the individual has a monthly income that is not less than the applicable Federal minimum wage requirement under 29 U.S.C. 206(a)(1)(C) multiplied by 80 hours."}
    - id: c2
      text: "States the 2026 figure is $580 per month ($7.25 x 80)."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "In 2026, the Federal minimum wage is $7.25 per hour,"}
        - {source_id: fed-ifr-2026-06-03, quote: "multiplied by 80 equals $580."}

- id: fed-0033
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: income_alternative
  drift_sensitive: false
  question: "Our state's minimum wage is $15 an hour. Is the income threshold $1,200 a month for my clients? And what about a tipped server paid a lower cash wage?"
  reference_answer: "No. States must use the single federal minimum wage ($7.25 in 2026), so the threshold is $580. A State minimum wage cannot replace it and a tipped wage cannot be used to set the threshold."
  rubric:
    - id: c1
      text: "States that the threshold uses the federal minimum wage ($7.25 in 2026), giving $580 per month."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "multiplied by 80 equals $580."}
        - {source_id: fed-ifr-2026-06-03, quote: "we interpret the Federal minimum wage to be the single, general minimum wage at section 6(a)(1)(C) of the FLSA for all applicable individuals"}
    - id: c2
      text: "States that States may not use a State-specific minimum wage in place of the federal minimum wage."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "States may not use such State-specific minimum wages in place of the applicable Federal minimum wage"}
    - id: c3
      text: "States that a tipped wage may not be used to identify the income threshold."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "States may not use a tipped wage (regardless of the industry or type of work) to identify the income threshold"}

- id: fed-0034
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: income_alternative
  drift_sensitive: false
  question: "Who counts as a seasonal worker for the income test, and how does the test work for them?"
  reference_answer: "A seasonal worker as described in 26 U.S.C. 45R(d)(5)(B) meets the requirement for a month if their average monthly income over the preceding six months is at least federal minimum wage x 80 hours ($580 in 2026)."
  rubric:
    - id: c1
      text: "States the person must be a seasonal worker as described in 26 U.S.C. 45R(d)(5)(B)."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the individual is a seasonal worker as described in 26 U.S.C. 45R(d)(5)(B)"}
    - id: c2
      text: "States the test is average monthly income over the preceding six months at least the federal minimum wage x 80 hours."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "had an average monthly income over the preceding six months that is not less than the applicable Federal minimum wage requirement under 29 U.S.C. 206(a)(1)(C) multiplied by 80 hours."}

- id: fed-0035
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: income_alternative
  drift_sensitive: false
  question: "My client is a seasonal worker who earned $1,500 in each of 2 months during the 6 months before she applied and nothing in the other 4. Her state has no reasonably predictable changes method. Does she meet the income test?"
  reference_answer: "No. The state averages the 6 preceding months: ($1,500 x 2) / 6 = $500, which is below $580, so she does not demonstrate community engagement for that month via the seasonal income test (she could still qualify through hours, an exception, or an exclusion)."
  rubric:
    - id: c1
      text: "Computes the 6-month average as $500 ($3,000 / 6)."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "Because $500 is below $580, this individual is not considered to be demonstrating community engagement in June based on the 6-month average monthly income for seasonal workers."}
    - id: c2
      text: "Concludes she does not meet the seasonal income test because $500 is below the $580 threshold."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "Because $500 is below $580, this individual is not considered to be demonstrating community engagement in June based on the 6-month average monthly income for seasonal workers."}
    - id: c3
      text: "Does not use only the two high-earning months (e.g. $1,500) as her monthly income for the test."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the State would use the individual's average income over the preceding 6 months, as provided at section 1902(xx)(2)(G) of the Act."}

- id: fed-0036
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: income_alternative
  drift_sensitive: false
  question: "My client's income swings a lot because of gig jobs, but she is not a seasonal worker. Can the state average her last 6 months of income like a seasonal worker?"
  reference_answer: "No, the 6-month average is only for seasonal workers. For others the state determines monthly income for the month being assessed, using its reasonably predictable changes methodology where it applies to fluctuating income."
  rubric:
    - id: c1
      text: "States that the preceding-6-month average applies only to seasonal workers."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "had an average monthly income over the preceding six months that is not less than the applicable Federal minimum wage requirement under 29 U.S.C. 206(a)(1)(C) multiplied by 80 hours."}
    - id: c2
      text: "States that for fluctuating income the state uses its reasonably predictable changes methodology where it applies."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "States must use their reasonably predictable changes methodology to determine monthly income when an individual has fluctuating income that is subject to the State's methodology."}

