  drift_sensitive: false
  question: "The national unemployment rate is 4.2 percent. My client's county has 6.5 percent unemployment. Does the county qualify for the high-unemployment hardship exception?"
  reference_answer: "Yes, if the state requested and CMS determined it. The test is at or above the lesser of 8 percent or 1.5 times the national rate: 1.5 x 4.2 = 6.3 percent, which is lower than 8, so 6.5 percent meets it. No individual request is required."
  rubric:
