# drift pair with fed-0037
- id: fed-0038
  split: heldout
  jurisdiction: US
  as_of: 2026-08-15
  category: income_alternative
  drift_sensitive: true
  question: "My client's verified income last month was $380 and we have no record of her hours. Can the state convert that income into 52 work hours so she only needs 28 more hours?"
  reference_answer: "Yes, as a state option. When monthly income is below $580 and the state has no hours information, it may divide the MAGI-based income by the federal minimum wage: $380 / $7.25 = 52 hours, leaving 28 hours to meet from other activities."
  rubric:
    - id: c1
      text: "States that, when income is below the threshold and the state lacks hours information, the state may divide monthly income by the federal minimum wage to credit work hours."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the agency must calculate the hours for work by dividing the monthly income as determined under paragraph (f)(2) of this section by the applicable Federal minimum wage requirement under 29 U.S.C. 206(a)(1)(C)."}
        - {source_id: fed-ifr-2026-06-03, quote: "this option must only be used when the monthly income is less than the applicable Federal minimum wage multiplied by 80 hours and the State does not have information regarding the number of hours worked"}
    - id: c2
      text: "States the example: $380 / $7.25 = 52 hours, leaving 28 additional hours needed."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the individual can be credited with having worked 52 hours for the month ($380 divided by $7.25). The individual would then need to participate in an additional 28 hours (80-52 = 28) of community engagement activities to meet the requirement for the month."}
    - id: c3
      text: "Does not claim the 52 hours alone satisfy the month."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the individual can be credited with having worked 52 hours for the month ($380 divided by $7.25). The individual would then need to participate in an additional 28 hours (80-52 = 28) of community engagement activities to meet the requirement for the month."}

- id: fed-0039
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: income_alternative
  drift_sensitive: false
  question: "Does the income test only count wages, or do other kinds of income count too?"
  reference_answer: "MAGI-based income counts: earned income plus countable unearned income. CMS considered counting only earned income and rejected that approach."
  rubric:
    - id: c1
      text: "States that countable income includes both earned income and countable unearned income."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "generally includes earned income as well as countable unearned income, meaning that States must take into account all of this income"}
    - id: c2
      text: "Does not claim only earned income (wages) counts for the income test."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "We considered using different interpretations of ``monthly income'' for the calculation. For example, we considered counting only earned income"}

- id: fed-0040
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: income_alternative
  drift_sensitive: false
  question: "My client got a big raise in the same month she applied for Medicaid. Which month's income does the state look at for the income test?"
  reference_answer: "The state evaluates income for the month or months of the review period (the look-back months before the application month at application, or the months between renewals), not the application month."
  rubric:
    - id: c1
      text: "States that income is evaluated for the month or months of the review period being assessed."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "States generally must evaluate the monthly income for the month or months of the review period"}
    - id: c2
      text: "States that at application the review period is the 1 to 3 consecutive months immediately preceding the application month."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "demonstration of community engagement for at least one, but not more than 3 consecutive months, as specified in the State plan, immediately preceding the month of application."}

- id: fed-0041
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: income_alternative
  drift_sensitive: false
  question: "A couple's combined income is converted to work hours under the income-to-hours option. How does the state split the hours between the spouses?"
  reference_answer: "The state must use a reasonable method to allocate the work hours between household members; the IFR does not prescribe a method, so it depends on the state."
  rubric:
    - id: c1
      text: "States that the state must use a reasonable method to allocate work hours between members of the household."
      kind: must_include
