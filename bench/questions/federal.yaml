  as_of: 2026-10-10
  category: lookback
  drift_sensitive: false
  question: "When someone applies for Medicaid, how many past months do they have to show work or other activity for?"
  reference_answer: "At least 1 and no more than 3 consecutive months immediately preceding the month of application, as specified by the state."
  rubric:
