- id: fed-0043
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: lookback
  drift_sensitive: false
  question: "A client plans to apply in March 2027 in a state that chose the maximum look-back. Which months must she show community engagement for?"
  reference_answer: "December 2026, January 2027 and February 2027 (the three consecutive months immediately before the application month)."
