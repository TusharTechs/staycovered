    - id: c2
      text: "States the review period then runs from the most recent demonstration to the date the next one is due."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "During the period between the most recent demonstration of community engagement and the date the individual's next demonstration of community engagement is due"}

