        - {source_id: fed-ifr-2026-06-03, quote: "(ii) 1.5 times the national unemployment rate."}
        - {source_id: fed-ifr-2026-06-03, quote: "the applicable individual resides in a county or equivalent unit of local government in which the unemployment rate is at or above the lesser of--"}
    - id: c2
      text: "Computes 1.5 x 4.2 = 6.3 percent and concludes 6.5 percent qualifies."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the applicable individual resides in a county or equivalent unit of local government in which the unemployment rate is at or above the lesser of--"}
    - id: c3
      text: "Notes the state must request and CMS must determine the county qualifies, and no individual request is required."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "Through a request from the State to CMS made in an electronic or hard-copy format, the State demonstrates and CMS determines"}
        - {source_id: fed-ifr-2026-06-03, quote: "A State must not require an applicable individual, or an individual acting on behalf of the applicable individual, to make a request for the circumstances described in paragraphs (d)(2) and (3) of this section."}

