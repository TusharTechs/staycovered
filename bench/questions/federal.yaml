  drift_sensitive: false
  question: "My client's daughter must travel three hours away for months of cancer treatment not available in their town. Is that a hardship exception?"
  reference_answer: "It can be, in a state that elected hardship exceptions: the individual or a dependent must travel outside their community for an extended period to receive medical services for a serious or complex condition not available locally. It requires a request, and the state defines 'community'."
  rubric:
    - id: c1
      text: "States that traveling (the person or a dependent) outside the community for an extended period for medical services for a serious or complex condition not available locally is a hardship event."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "must travel outside of their community of residence for an extended period of time (which could be for part or all of a month or longer) to receive medical services necessary to treat a serious or complex medical condition"}
    - id: c2
      text: "States this exception is subject to a request and is available only if the state elected hardship exceptions."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "A short-term hardship event exists when, for all or part of a month, and subject to a request in the circumstances described in paragraphs (d)(1) and (4) of this section by an applicable individual or an individual acting on behalf of the applicable individual"}
        - {source_id: fed-ifr-2026-06-03, quote: "(a) Scope. At State option, the agency may provide that an applicable individual"}

- id: fed-0079
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: good_cause
  drift_sensitive: false
  question: "Can my client who already qualifies as a specified excluded individual also use the hardship exception?"
  reference_answer: "No need, and the State must not apply the hardship exception to specified excluded individuals; they are not subject to the requirement at all."
  rubric:
    - id: c1
      text: "States that a State must not apply the short-term hardship exception to a specified excluded individual."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(f) Excluded individuals. A State must not apply paragraph (a) of this section to a specified excluded individual defined at Sec. 435.554."}
    - id: c2
      text: "States that community engagement is not a condition of eligibility for specified excluded individuals."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "Community engagement is not a condition of eligibility for specified excluded individuals."}

- id: fed-0080
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: good_cause
  drift_sensitive: false
  question: "Is the state required to tell people about hardship exceptions in the notices it sends, and can the state apply disaster and unemployment hardships without asking my client for anything?"
  reference_answer: "States that elected the hardship option must include information about hardship events in outreach and noncompliance notices, and must apply the disaster and unemployment-based exceptions automatically without requesting information from the individual."
  rubric:
    - id: c1
      text: "States that states electing the hardship exception must apply the disaster and unemployment exceptions automatically."
      kind: must_include
      citations:
        - {source_id: fed-ifr-correction-2026-06-29, quote: "Apply an automatic short-term hardship exception to applicable individuals if, for part or all of a month for which such applicable individuals are required to demonstrate community engagement, the individuals reside in a county"}
    - id: c2
      text: "States that states electing hardship exceptions must include information about them in outreach and noncompliance notices."
      kind: must_include
      citations:
        - {source_id: cms-ifc-overview-deck-2026-07-27, quote: "States that have elected to provide short-term hardship exceptions must include information about their availability in outreach and noncompliance notices."}

# drift pair with fed-0082
- id: fed-0081
  split: dev
  jurisdiction: US
  as_of: 2026-05-15
  category: notice_cure
  drift_sensitive: true
  question: "My client's noncompliance notice is dated March 1. When does her 30-day window to respond start?"
  reference_answer: "Under the statute the 30 calendar days begin on the date the notice is received by the individual. As of 2026-05-15 no federal rule yet said when a mailed notice is deemed received (the 5-day presumption came with the later IFR)."
  rubric:
    - id: c1
      text: "States the 30-calendar-day period begins on the date the notice is received by the individual."
      kind: must_include
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "(ii)(I) provide such individual with a period of 30 calendar days, beginning on the date on which such notice of noncompliance is received by the individual, to--"}
    - id: c2
      text: "Does not state as an established rule that a notice is deemed received 5 days after its date."
      kind: must_not_claim
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "Not later than June 1, 2026, the Secretary of Health and Human Services shall promulgate an interim final rule"}

# drift pair with fed-0081
- id: fed-0082
  split: dev
  jurisdiction: US
  as_of: 2026-08-15
  category: notice_cure
  drift_sensitive: true
  question: "My client's noncompliance notice is dated March 1. When does her 30-day window to respond start?"
  reference_answer: "The 30 calendar days start on the date she receives the notice, and a notice is considered received 5 days after the date on it (March 6) unless she shows she did not receive it within those 5 days."
  rubric:
    - id: c1
      text: "States the notice is considered received 5 days after the date on the notice, unless the person shows otherwise."
      kind: must_include
      citations:
        - {source_id: fed-ifr-correction-2026-06-29, quote: "Is considered to be received 5 days after the date on the notice, unless the applicant or beneficiary shows that he or she did not receive the notice within the 5-day period."}
    - id: c2
      text: "States the 30-calendar-day period begins on the date the notice is received (so around March 6)."
      kind: must_include
      citations:
        - {source_id: fed-ifr-correction-2026-06-29, quote: "(2) Provide such individual with a period of 30 calendar days beginning on the date on which such notice of noncompliance is received by the individual"}
    - id: c3
      text: "Does not say the 30 days always start on the date printed on the notice."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-correction-2026-06-29, quote: "Is considered to be received 5 days after the date on the notice, unless the applicant or beneficiary shows that he or she did not receive the notice within the 5-day period."}

# drift pair with fed-0084
- id: fed-0083
  split: heldout
  jurisdiction: US
  as_of: 2026-05-15
  category: notice_cure
  drift_sensitive: true
  question: "The state wants to disenroll my client for noncompliance. What notice and hearing rights must she get first?"
  reference_answer: "Under the statute, before denying or disenrolling the state must have given the noncompliance notice and 30 calendar days to respond, checked other eligibility bases, and provided written notice and an opportunity for a fair hearing. The 10-day advance notice minimum was set only in the later IFR."
  rubric:
    - id: c1
      text: "States the individual must be provided written notice and an opportunity for a fair hearing before denial or disenrollment."
      kind: must_include
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "the individual is provided written notice and granted an opportunity for a fair hearing in accordance with subsection (a)(3)."}
    - id: c2
      text: "States the state must first determine whether there is any other basis for eligibility."
      kind: must_include
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "the State first determines whether, with respect to the individual, there is any other basis for eligibility for medical assistance"}
    - id: c3
      text: "Does not state a specific federal 10-day advance notice rule as already issued for this purpose."
      kind: must_not_claim
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "the individual is provided written notice and granted an opportunity for a fair hearing in accordance with subsection (a)(3)."}

# drift pair with fed-0083
- id: fed-0084
  split: heldout
  jurisdiction: US
  as_of: 2026-08-15
  category: notice_cure
  drift_sensitive: true
  question: "The state wants to disenroll my client for noncompliance. What notice and hearing rights must she get first?"
  reference_answer: "Advance written notice with fair hearing rights; the IFR requires at least 10 days' advance notice for an eligibility termination or reduction. The state must also first consider all other bases of eligibility."
  rubric:
    - id: c1
      text: "States at least 10 days' advance written notice is required for a termination, with fair hearing rights."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the State must provide written notice (including at least 10 days advance notice in the case of an eligibility termination or reduction)"}
    - id: c2
      text: "States the state must consider all other bases of eligibility before disenrolling."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "Consider all other bases of eligibility for medical assistance under the State plan (or waiver of such plan)"}

- id: fed-0085
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: notice_cure
  drift_sensitive: false
  question: "After my client gets a noncompliance notice, does she keep her Medicaid during the 30 days?"
  reference_answer: "Yes. An enrolled beneficiary continues to receive Medicaid during the 30-day period until determined ineligible."
  rubric:
    - id: c1
      text: "States that enrolled beneficiaries continue to receive Medicaid during the 30-calendar-day period."
      kind: must_include
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "continue to provide such individual with medical assistance during such 30-calendar- day period"}
        - {source_id: fed-ifr-correction-2026-06-29, quote: "(3) Continue to furnish Medicaid for an enrolled beneficiary until the individual is determined ineligible consistent with Sec. 435.930(b)."}
    - id: c2
      text: "Does not claim coverage is suspended as soon as the notice is sent."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-correction-2026-06-29, quote: "(3) Continue to furnish Medicaid for an enrolled beneficiary until the individual is determined ineligible consistent with Sec. 435.930(b)."}

- id: fed-0086
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: notice_cure
  drift_sensitive: false
  question: "If my client doesn't respond to the notice and loses Medicaid, can she buy subsidized Marketplace coverage instead?"
  reference_answer: "No premium subsidies. A person who loses Medicaid for failing the work requirement is deemed eligible for minimum essential coverage and is precluded from advance premium tax credits and premium tax credits. The state must first check other bases of Medicaid eligibility, and the notice must explain this consequence."
  rubric:
    - id: c1
      text: "States that loss of Medicaid for failing community engagement precludes eligibility for APTC and the premium tax credit."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "is precluded from eligibility for APTC and PTC."}
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "an individual shall be deemed to be eligible for minimum essential coverage described in section 5000A(f)(1)(A)(ii) of such Code for a month if such individual would have been eligible for medical assistance"}
    - id: c2
      text: "States the noncompliance notice must describe the consequences, including for APTC/PTC."
      kind: must_include
      citations:
        - {source_id: fed-ifr-correction-2026-06-29, quote: "A description of the consequences of noncompliance with the community engagement requirement and failure to respond to the notice of noncompliance for Medicaid eligibility and eligibility for advance payments of the premium tax credit (APTC) and the premium tax credit (PTC)"}
    - id: c3
      text: "Does not claim she would qualify for Marketplace premium tax credits after being disenrolled for noncompliance."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "is precluded from eligibility for APTC and PTC."}

- id: fed-0087
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: notice_cure
  drift_sensitive: false
  question: "What can my client show during the 30 days after a noncompliance notice, other than hours worked?"
  reference_answer: "She can make a satisfactory showing of compliance, that she should be deemed compliant under an exception, or that the requirement does not apply to her because she is not an applicable individual (for example a specified excluded individual such as a caregiver or medically frail)."
  rubric:
    - id: c1
      text: "States she may show compliance or deemed compliance (an exception)."
      kind: must_include
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "(ii)(I) provide such individual with a period of 30 calendar days, beginning on the date on which such notice of noncompliance is received by the individual, to--"}
    - id: c2
      text: "States she may show the requirement does not apply to her because she is not an applicable individual (for example she meets an exclusion)."
      kind: must_include
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "make a satisfactory showing to the State that such requirement does not apply to such individual on the basis that such individual does not meet the definition of applicable individual"}

- id: fed-0088
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: notice_cure
  drift_sensitive: false
  question: "My client was disenrolled for noncompliance. Is she locked out of Medicaid for a period, or can she reapply right away?"
  reference_answer: "She can reapply. States must not impose any restriction on an individual's ability to re-apply or to receive coverage if eligible, based on a prior denial or disenrollment for noncompliance. The noncompliance notice must explain how to reapply."
  rubric:
    - id: c1
      text: "States that a state must not impose any restriction on the ability to re-apply for coverage after a denial or disenrollment for noncompliance."
      kind: must_include
      citations:
        - {source_id: fed-ifr-correction-2026-06-29, quote: "An agency must not impose any restriction on an applicable individual's ability to re-apply for coverage"}
    - id: c2
      text: "Does not claim there is a mandatory waiting or lock-out period after disenrollment for noncompliance."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-correction-2026-06-29, quote: "An agency must not impose any restriction on an applicable individual's ability to re-apply for coverage"}

- id: fed-0089
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: calculation
  drift_sensitive: false
  question: "My client's verified monthly income is $203, the state has no record of her hours, and the state uses the income-to-hours option. How many hours are credited and how many more does she need in 2026?"
  reference_answer: "$203 / $7.25 = 28 hours credited; she needs 80 - 28 = 52 more hours of qualifying activity."
  rubric:
    - id: c1
      text: "Computes 28 credited hours ($203 divided by $7.25)."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the agency must calculate the hours for work by dividing the monthly income as determined under paragraph (f)(2) of this section by the applicable Federal minimum wage requirement under 29 U.S.C. 206(a)(1)(C)."}
    - id: c2
      text: "States she needs 52 more hours to reach 80."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the individual can be credited with having worked 52 hours for the month ($380 divided by $7.25). The individual would then need to participate in an additional 28 hours (80-52 = 28) of community engagement activities to meet the requirement for the month."}
    - id: c3
      text: "Does not divide by a State or local minimum wage."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "States may not use such State-specific minimum wages in place of the applicable Federal minimum wage"}

- id: fed-0090
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: calculation
  drift_sensitive: false
  question: "A client's verified income is $290 for the month, and she also did 25 hours of community service. The state uses the income-to-hours option. Does she meet the requirement, and if not how many hours short is she?"
  reference_answer: "$290 / $7.25 = 40 work hours credited; plus 25 community service hours = 65 hours; she is 15 hours short of 80."
  rubric:
    - id: c1
      text: "Computes 40 work hours from $290 / $7.25."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the agency must calculate the hours for work by dividing the monthly income as determined under paragraph (f)(2) of this section by the applicable Federal minimum wage requirement under 29 U.S.C. 206(a)(1)(C)."}
    - id: c2
      text: "Combines with 25 community service hours for 65 total and states she is 15 hours short."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "for a total of not less than 80 hours; however, States are not permitted to combine educational program hours with another activity if the individual is enrolled in an educational program at least half-time."}
    - id: c3
      text: "Does not conclude she meets the requirement."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "the individual can be credited with having worked 52 hours for the month ($380 divided by $7.25). The individual would then need to participate in an additional 28 hours (80-52 = 28) of community engagement activities to meet the requirement for the month."}

- id: fed-0091
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: calculation
  drift_sensitive: false
  question: "A client is enrolled in 3 credit hours (less than half-time) and works 40 hours that month. Using the federal formula for less-than-half-time students, does she reach 80 hours?"
  reference_answer: "Education hours = 3 credits x 3 hours x 4.33 = 38.97 hours. Total = 38.97 + 40 = 78.97, which is less than 80, so she does not reach 80 hours (about 1.03 hours short)."
  rubric:
    - id: c1
      text: "Computes education hours as 3 x 3 x 4.33 = about 38.97."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(i) Multiply the number of each one credit hour of instruction by 3 to get the total of education hours in a week."}
    - id: c2
      text: "Adds 40 work hours for about 78.97 and concludes she does not reach 80."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "for a total of not less than 80 hours; however, States are not permitted to combine educational program hours with another activity if the individual is enrolled in an educational program at least half-time."}
    - id: c3
      text: "Does not treat her as satisfying the half-time enrollment alternative."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(4) The individual is enrolled in an educational program at least half-time."}

- id: fed-0092
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: calculation
  drift_sensitive: false
  question: "A client provides 55 hours a month of unpaid care to a disabled adult she is not related to and does not live with. How many more hours does she need, and does she qualify as an excluded family caregiver?"
  reference_answer: "Not excluded as a family caregiver (needs at least 80 hours for a non-relative, non-resident). Her 55 hours count as work, so she needs 25 more hours of other qualifying activity to reach 80."
  rubric:
    - id: c1
      text: "States she is not excluded because a non-relative non-resident caregiver needs at least 80 hours of assistance per month."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "for whom he or she provides not less than 80 hours of assistance that is not solely incidental in nature per month."}
    - id: c2
      text: "States the 55 hours count toward the requirement and she needs 25 additional hours."
      kind: must_include
      citations:
        - {source_id: cms-ifc-overview-deck-2026-07-27, quote: "Those 55 hours of work would count toward demonstrating community engagement and the individual would need 25 additional hours"}

- id: fed-0093
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: calculation
  drift_sensitive: false
  question: "A seasonal worker earned $3,600 in total over the six months before the month being assessed (all in two months). Under the 2026 federal minimum wage, does she meet the seasonal worker income test?"
  reference_answer: "Average monthly income = $3,600 / 6 = $600, which is not less than $580 (7.25 x 80), so she meets the seasonal income test for that month."
  rubric:
    - id: c1
      text: "Computes the 6-month average as $600."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "had an average monthly income over the preceding six months that is not less than the applicable Federal minimum wage requirement under 29 U.S.C. 206(a)(1)(C) multiplied by 80 hours."}
    - id: c2
      text: "Compares with the $580 threshold and concludes she meets the test."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "multiplied by 80 equals $580."}

- id: fed-0094
  split: heldout
  jurisdiction: US
  as_of: 2027-03-01
  category: calculation
  drift_sensitive: false
  question: "A client in an expansion state received her noncompliance notice dated March 1, 2027, and did not respond at all. Using the deemed-receipt rule, what is the latest date by which the state must disenroll her?"
  reference_answer: "Notice is considered received 5 days after its date (March 6, 2027). The 30-calendar-day period ends in early April 2027. The state must disenroll no later than the end of the month following the month in which that period ends, i.e. May 31, 2027, after advance written notice and fair hearing rights."
  rubric:
    - id: c1
      text: "States the notice is deemed received 5 days after its date (about March 6) and the 30-day period therefore ends in April 2027."
      kind: must_include
      citations:
        - {source_id: fed-ifr-correction-2026-06-29, quote: "Is considered to be received 5 days after the date on the notice, unless the applicant or beneficiary shows that he or she did not receive the notice within the 5-day period."}
        - {source_id: fed-ifr-correction-2026-06-29, quote: "(2) Provide such individual with a period of 30 calendar days beginning on the date on which such notice of noncompliance is received by the individual"}
    - id: c2
      text: "States disenrollment must occur not later than the end of the month following the month the 30-day period ends, i.e. May 31, 2027."
      kind: must_include
      citations:
        - {source_id: fed-ifr-correction-2026-06-29, quote: "Disenroll such beneficiary not later than the end of the month following the month in which the 30-calendar day period under paragraph (a)(2) of this section ends and after the provision of advance written notice and fair hearing rights"}

- id: fed-0095
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: calculation
  drift_sensitive: false
  question: "My client earns $400 a month and her husband, in her MAGI household, earns $200 a month. Under the 2026 federal minimum wage, does their income meet the income test, and is her own $400 enough alone?"
  reference_answer: "Household MAGI income is $400 + $200 = $600, which is at least $580, so the income test is met. Her own $400 alone would be below $580, but the test counts total household income."
  rubric:
    - id: c1
      text: "Uses total household MAGI income of $600 and concludes the $580 threshold is met."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "Under Sec. 435.603(d) and (f), household income is the total income of everyone in the individual's household."}
        - {source_id: fed-ifr-2026-06-03, quote: "multiplied by 80 equals $580."}
    - id: c2
      text: "Does not conclude she fails the income test by considering only her own $400."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "Under Sec. 435.603(d) and (f), household income is the total income of everyone in the individual's household."}
