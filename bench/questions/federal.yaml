  reference_answer: "As of 2026-05-15 the statute excludes someone 'medically frail or otherwise has special medical needs (as defined by the Secretary)', including individuals who are blind or disabled, have a substance use disorder, a disabling mental disorder, a disability significantly impairing ADLs, or a serious or complex medical condition. The Secretary's definition had not been issued yet, so no federal significant-impairment test or condition-list rule existed yet."
  rubric:
    - id: c1
      text: "States that the statute defers to the Secretary to define medically frail / special medical needs."
      kind: must_include
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "who is medically frail or otherwise has special medical needs (as defined by the Secretary), including an individual--"}
    - id: c2
      text: "Lists the statute's categories (blind or disabled, substance use disorder, disabling mental disorder, physical/intellectual/developmental disability impairing ADLs, serious or complex medical condition)."
      kind: must_include
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "with a serious or complex medical condition;"}
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "with a disabling mental disorder;"}
    - id: c3
      text: "Does not state as an issued federal rule that the condition must 'significantly impair the ability to comply' or that states must keep an auditable condition list."
      kind: must_not_claim
      citations:
        - {source_id: fed-statute-hr1-pl119-21-2025-07-04, quote: "Not later than June 1, 2026, the Secretary of Health and Human Services shall promulgate an interim final rule"}

# drift pair with fed-0059
- id: fed-0060
  split: heldout
  jurisdiction: US
  as_of: 2026-08-15
  category: exemption
  drift_sensitive: true
  question: "How is 'medically frail' defined for the work requirement exclusion, and does a diagnosis alone get my client excluded?"
  reference_answer: "Under the IFR, medically frail means a physical, mental or other behavioral health condition that significantly impairs the ability to comply with the requirement AND the person falls in one of five categories (blind/disabled; SUD excluding stable recovery of 5+ years; disabling mental disorder; disability significantly impairing ADLs; serious or complex medical condition). A diagnosis alone is not enough; the impairment must be shown, and states keep an auditable condition list."
  rubric:
    - id: c1
      text: "States the condition must significantly impair the individual's ability to comply with the community engagement requirement."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "is defined as an individual whose physical, mental, or other behavioral health condition significantly impairs the individual's ability to comply with the community engagement requirement in this subpart and is an individual:"}
    - id: c2
      text: "Lists the five categories (blind or disabled, SUD, disabling mental disorder, ADL-impairing disability, serious or complex condition)."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(A) Who is blind or disabled (as defined in section 1614 of the Social Security Act);"}
        - {source_id: fed-ifr-2026-06-03, quote: "(C) With a disabling mental disorder;"}
        - {source_id: fed-ifr-2026-06-03, quote: "(E) With a serious or complex medical condition which is a medical condition that is life threatening"}
    - id: c3
      text: "Does not claim that having a diagnosis alone automatically qualifies a person as medically frail."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "is defined as an individual whose physical, mental, or other behavioral health condition significantly impairs the individual's ability to comply with the community engagement requirement in this subpart and is an individual:"}

