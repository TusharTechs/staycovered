      text: "States that CMS has identified 13 demonstration populations in eight States as subject to the requirement."
      kind: must_include
      citations:
        - {source_id: cms-ifc-overview-deck-2026-07-27, quote: "To date, CMS has identified 13 such populations in eight States."}
    - id: c2
      text: "States that Georgia's Pathways to Coverage population is on CMS's list."
      kind: must_include
      citations:
        - {source_id: cms-ifc-overview-deck-2026-07-27, quote: "Pathways to Coverage: Pathways population & ESI/HIPP"}
    - id: c3
      text: "Does not say CMS is still undecided about which 1115 populations are covered."
      kind: must_not_claim
      citations:
        - {source_id: cms-ifc-overview-deck-2026-07-27, quote: "To date, CMS has identified 13 such populations in eight States."}

- id: fed-0021
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: requirement
  drift_sensitive: false
  question: "What are all the ways a person can meet the monthly work requirement?"
  reference_answer: "In a month: work at least 80 hours; complete 80 hours of community service; participate in a work program 80 hours; be enrolled in an educational program at least half-time; any combination of work, community service and work program hours totaling 80; or meet the income test (monthly income of at least federal minimum wage x 80 hours); seasonal workers can use a 6-month average income."
  rubric:
    - id: c1
      text: "Lists work, community service, and work program participation at not less than 80 hours each."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(1) The individual works not less than 80 hours."}
        - {source_id: fed-ifr-2026-06-03, quote: "(2) The individual completes not less than 80 hours of community service."}
        - {source_id: fed-ifr-2026-06-03, quote: "(3) The individual participates in a work program for not less than 80 hours."}
    - id: c2
      text: "Lists enrollment in an educational program at least half-time."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(4) The individual is enrolled in an educational program at least half-time."}
    - id: c3
      text: "Lists combining activities to total 80 hours and the monthly income alternative."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "for a total of not less than 80 hours; however, States are not permitted to combine educational program hours with another activity if the individual is enrolled in an educational program at least half-time."}
        - {source_id: fed-ifr-2026-06-03, quote: "(1) An applicable individual demonstrates community engagement for a month if the individual has a monthly income that is not less than the applicable Federal minimum wage requirement under 29 U.S.C. 206(a)(1)(C) multiplied by 80 hours."}

- id: fed-0022
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: requirement
  drift_sensitive: false
  question: "My client volunteers 90 hours a month at a food pantry run by a nonprofit. Does that satisfy the requirement, and what has to be true about the organization?"
  reference_answer: "Yes, if it is community service: unpaid work in a structured program for the direct benefit of the community under a public or nonprofit organization that can track and confirm the hours, with no partisan purpose. 80+ hours meets the month."
  rubric:
    - id: c1
      text: "States that 80 or more hours of community service in a month satisfies the requirement."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(2) The individual completes not less than 80 hours of community service."}
    - id: c2
      text: "States the organization must be able to confirm the hours (a point of contact)."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "a point of contact who can confirm the hours completed."}
    - id: c3
      text: "States community service must not serve a partisan purpose and is under a public or nonprofit/established organization."
      kind: must_include
      citations:
        - {source_id: cms-ifc-overview-deck-2026-07-27, quote: "The activity must not serve a partisan purpose."}

- id: fed-0023
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: requirement
  drift_sensitive: false
  question: "My client is enrolled in community college at least half-time but works only 20 hours a month. Does she need to add hours to reach 80?"
  reference_answer: "No. Being enrolled in an educational program at least half-time satisfies the requirement for the month by itself; the school determines half-time status. Education hours are not combined with other activities for half-time students."
  rubric:
    - id: c1
      text: "States that half-time (or greater) enrollment in an educational program satisfies the month without any hour count."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(4) The individual is enrolled in an educational program at least half-time."}
    - id: c2
      text: "States that enrollment status (full-time, half-time, less than half-time) is determined by the school or institution."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "enrollment status in an educational program (full-time, half-time, less than half-time) is determined by the school or institution."}
    - id: c3
      text: "Does not claim she must also reach 80 hours of work or service in addition to being enrolled half-time."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "for a total of not less than 80 hours; however, States are not permitted to combine educational program hours with another activity if the individual is enrolled in an educational program at least half-time."}

- id: fed-0024
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: requirement
  drift_sensitive: false
  question: "My client takes classes but is enrolled less than half-time. Can her classroom time count toward the 80 hours?"
  reference_answer: "Yes. For less-than-half-time students, education hours are counted and added to other qualifying activities. For credit-hour programs, credit hours x 3 hours per week x 4.33 weeks gives monthly hours; for non-credit programs, States count class and educational-activity hours."
  rubric:
    - id: c1
      text: "States that hours from less-than-half-time enrollment can be combined with other qualifying activities toward 80 hours."
      kind: must_include
      citations:
        - {source_id: cms-ifc-overview-deck-2026-07-27, quote: "Hours accrued by an individual enrolled in an educational program less than half-time may be combined with hours performed for other activities to count towards demonstrating community engagement."}
    - id: c2
      text: "States the credit-hour method: multiply credit hours by 3 for weekly hours, then by 4.33 for monthly hours."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(i) Multiply the number of each one credit hour of instruction by 3 to get the total of education hours in a week."}

- id: fed-0025
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: requirement
  drift_sensitive: false
  question: "My client watches a neighbor's kids and gets groceries in exchange, about 30 hours a month. Is that 'work' for this requirement?"
  reference_answer: "Yes. Work includes paid work, work in exchange for goods or services (in-kind work), and unpaid work other than community service, so the 30 hours can count toward the 80."
  rubric:
    - id: c1
      text: "States that in-kind work (work in exchange for goods or services) counts as work."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(ii) Work in exchange for goods or services (``in-kind'' work); and"}
    - id: c2
      text: "States that unpaid work other than community service also counts as work, and hours can be combined with other activities."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(iii) Unpaid work (other than community service as defined in this paragraph (b))."}
        - {source_id: fed-ifr-2026-06-03, quote: "for a total of not less than 80 hours; however, States are not permitted to combine educational program hours with another activity if the individual is enrolled in an educational program at least half-time."}

- id: fed-0026
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: requirement
  drift_sensitive: false
  question: "My client was ordered by a court to do community service and also volunteers for a political campaign. Do either of those count as community service?"
  reference_answer: "Court-mandated unpaid service with a structured program under a public/nonprofit organization can count (community service may be voluntary or court-ordered). Work for a partisan purpose such as a political campaign does not count as community service."
  rubric:
    - id: c1
      text: "States that community service can be completed voluntarily or because of a court-ordered mandate."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "Community service means unpaid work, completed voluntarily or because of a mandate by court order, with a structured program"}
    - id: c2
      text: "States that community service must not serve a partisan purpose, so political campaign work does not qualify as community service."
      kind: must_include
      citations:
        - {source_id: cms-ifc-overview-deck-2026-07-27, quote: "The activity must not serve a partisan purpose."}

- id: fed-0027
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: requirement
  drift_sensitive: false
  question: "My client does a supervised job search program through a state employment office 80 hours a month. Does that count as a work program?"
  reference_answer: "No, not by itself. Work program covers WIOA title I programs, Trade Act programs, State-approved employment and training programs (including SNAP E&T), veterans' employment and training programs, etc., but excludes a supervised job search or job search training program."
  rubric:
    - id: c1
      text: "States that a supervised job search program or job search training program does not qualify as a work program."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "other than a supervised job search program or job search training program."}
    - id: c2
      text: "Names at least one qualifying type of work program (for example WIOA title I programs or State-approved employment and training programs such as SNAP E&T)."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(i) A program under title I of the Workforce Innovation and Opportunity Act (WIOA)"}

- id: fed-0028
  split: dev
  jurisdiction: US
  as_of: 2026-10-10
  category: requirement
  drift_sensitive: false
  question: "My 22-year-old client is enrolled in a GED program but never finished high school. Does that count as an educational program?"
  reference_answer: "Yes. Educational program includes a State-approved program of study leading to a certificate of high school equivalence for someone without a high school diploma (along with higher education, career and technical education, and high school). Half-time status is set by the program."
  rubric:
    - id: c1
      text: "States that a State-approved program leading to high school equivalence counts as an educational program for someone without a diploma."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(iv) A State-approved program of study leading to a certificate of high school equivalence for an applicable individual who has not received a high school diploma."}
    - id: c2
      text: "States that half-time or greater enrollment satisfies the month, with status determined by the school."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "(4) The individual is enrolled in an educational program at least half-time."}
        - {source_id: fed-ifr-2026-06-03, quote: "enrollment status in an educational program (full-time, half-time, less than half-time) is determined by the school or institution."}

- id: fed-0029
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: requirement
  drift_sensitive: false
  question: "My client works 50 hours as a cashier and does 30 hours of community service in the same month. Does she meet the requirement?"
  reference_answer: "Yes. Hours from work, community service and work program activities are added; 50 + 30 = 80 meets the not-less-than-80-hours standard."
  rubric:
    - id: c1
      text: "States that hours across work, community service and work program activities can be combined for a total of not less than 80."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "for a total of not less than 80 hours; however, States are not permitted to combine educational program hours with another activity if the individual is enrolled in an educational program at least half-time."}
    - id: c2
      text: "Concludes that 50 + 30 = 80 hours satisfies the month."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "for a total of not less than 80 hours; however, States are not permitted to combine educational program hours with another activity if the individual is enrolled in an educational program at least half-time."}

