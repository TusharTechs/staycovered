- id: fed-0044
  split: heldout
  jurisdiction: US
  as_of: 2026-10-10
  category: lookback
  drift_sensitive: false
  question: "For an existing enrollee at renewal, how many months does she have to show activity, and which months?"
  reference_answer: "One or more months as specified by the state plan, whether or not consecutive, within the period between her most recent determination and the date renewal is due. CMS's December 2025 bulletin says the state may not dictate which specific months."
  rubric:
    - id: c1
      text: "States the requirement is for 1 or more months (as specified by the state), consecutive or not, in the period since the last determination up to the renewal due date."
