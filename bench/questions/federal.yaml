# drift pair with fed-0063
- id: fed-0064
  split: dev
  jurisdiction: US
  as_of: 2026-08-15
  category: exemption
  drift_sensitive: true
  question: "My client helps a disabled neighbor about 30 hours a month. They are not related and don't live together. Is she excluded as a family caregiver?"
  reference_answer: "No. A caregiver who does not live with and is not related to the care recipient must provide at least 80 hours per month of assistance that is not solely incidental to be excluded. Her 30 hours can instead count toward the 80 hours of qualifying activity."
  rubric:
    - id: c1
      text: "States that a non-relative, non-resident family caregiver must provide not less than 80 hours of non-incidental assistance per month to be excluded."
      kind: must_include
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "for whom he or she provides not less than 80 hours of assistance that is not solely incidental in nature per month."}
    - id: c2
      text: "States that caregiving hours under 80 can be counted toward the community engagement hours."
      kind: must_include
      citations:
        - {source_id: cms-ifc-overview-deck-2026-07-27, quote: "Caregiving hours less than 80 hours per month may be counted towards qualifying community engagement activities for applicable individuals"}
    - id: c3
      text: "Does not claim that 30 hours of caregiving makes her a specified excluded individual."
      kind: must_not_claim
      citations:
        - {source_id: fed-ifr-2026-06-03, quote: "for whom he or she provides not less than 80 hours of assistance that is not solely incidental in nature per month."}

